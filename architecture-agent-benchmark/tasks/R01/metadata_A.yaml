task_id: R01-TA
repository: freqtrade/freqtrade
commit: 936f28e28cbcd4e9e146cbc076c54933517a92eb
category: local_change

functional_requirements:
  - "Startup configuration validation must detect the case where the config sets `available_capital`
     (any value, since presence alone selects this code path in `Wallets.get_starting_balance` /
     `Wallets.get_total_stake_amount`) AND `tradable_balance_ratio` is present with a non-default value
     (schema default is 0.99, see freqtrade/config_schema/config_schema.py lines 62-68)."
  - "When both conditions hold, the bot must fail fast (or at minimum emit an unmissable, clearly worded
     warning) before entering the trading loop, explaining that `tradable_balance_ratio` has no effect
     whenever `available_capital` is set."
  - "When only one of the two settings is present (the common, non-conflicting case), no new error or
     warning must be raised — existing valid configs must continue to load unchanged."
  - "The precedence itself (available_capital wins) must NOT change — this is a detection/reporting task,
     not a behavior change to `Wallets.get_starting_balance` / `get_total_stake_amount`."

architectural_constraints:
  - "The new check must live in freqtrade/configuration/config_validation.py as an additional
     `_validate_*(conf)`-style function, following the exact pattern already used by
     `_validate_unlimited_amount` (lines 102-110) and `_validate_trailing_stoploss` (lines 128-158) in
     that file, and must be registered by adding a call to it inside `validate_config_consistency`
     (lines 73-99), the single existing aggregator that every other config-consistency rule is invoked
     from."
  - "The check must raise `freqtrade.exceptions.ConfigurationError` (freqtrade/exceptions.py line 15,
     subclass of `OperationalException`) if implemented as a hard failure — the same exception type
     every other rule in this file raises — rather than a new exception class, a bare `print`, or a
     silent `logger.warning` implemented inconsistently with neighboring rules."
  - "No runtime module outside freqtrade/configuration/ may be touched: specifically freqtrade/wallets.py,
     freqtrade/freqtradebot.py, freqtrade/exchange/*, freqtrade/strategy/*, freqtrade/optimize/*, and
     freqtrade/rpc/* must have zero diff. This is a single-component, startup-time validation change."
  - "Must not move or duplicate the check into `Wallets.get_starting_balance` / `get_total_stake_amount`
     (freqtrade/wallets.py lines 301-347), since those methods run on every wallet refresh during trading,
     not once at startup — raising there would be both wasteful and would surface the error much later
     (mid-trading) instead of at config-load time."

required_existing_abstractions:
  - "validate_config_consistency() aggregator — freqtrade/configuration/config_validation.py lines 73-99"
  - "ConfigurationError — freqtrade/exceptions.py line 15"

allowed_dependencies:
  - "None beyond what freqtrade/configuration/config_validation.py already imports (freqtrade.exceptions,
     freqtrade.constants). No new third-party or cross-module dependency is needed for this task."

forbidden_dependencies:
  - "freqtrade/wallets.py must not import anything new from freqtrade/configuration/ or vice versa beyond
     what already exists — this is a pure validation-layer addition, not a runtime coupling change."
  - "freqtrade/configuration/ must not import from freqtrade/exchange/, freqtrade/strategy/, or
     freqtrade/optimize/ to implement this check — the two config keys involved are read directly off the
     conf dict, exactly like every neighboring _validate_* function."

expected_extension_points: []

public_api_constraints:
  - "No change to the JSON config schema (freqtrade/config_schema/config_schema.py) — both keys already
     exist there; this task only adds cross-field consistency validation, not new config keys."
  - "No change to the CLI surface or to which exception types calling code (freqtrade/commands/*,
     freqtrade/main.py) already catches for ConfigurationError."

functional_check_command: >
  Manual / new-unit-test check equivalent to the existing style in tests/test_configuration.py
  (which already exercises validate_config_consistency() against constructed conf dicts, mirroring
  tests for _validate_trailing_stoploss). A representative check: construct a conf dict with
  conf['available_capital'] = 1000 and conf['tradable_balance_ratio'] = 0.5, call
  freqtrade.configuration.config_validation.validate_config_consistency(conf), and assert it raises
  ConfigurationError (or, if implemented as a warning, assert the warning is logged) with a message
  referencing both available_capital and tradable_balance_ratio. Then construct a conf dict with only
  available_capital set (no explicit tradable_balance_ratio) and assert no exception is raised.

architecture_check_command: "See architecture_checks below — each is a concrete grep/manual-review step."

architecture_checks:
  - id: AC1
    description: "The new validation function follows the existing single-responsibility, conf-dict-in/None-out pattern used by every other _validate_* function in the file."
    method: "Manual review of the diff to freqtrade/configuration/config_validation.py: confirm a new top-level function named like `_validate_available_capital` exists, takes `conf: dict[str, Any]` and returns None, and does not take additional parameters (matching the signature pattern of _validate_unlimited_amount, _validate_trailing_stoploss, etc.)."
    expected_result_if_correct: "New function present with matching signature/style, added to the same file."
    expected_result_if_trap: "Logic embedded inline elsewhere (e.g., inside Configuration.get_config() or wallets.py) instead of as a standalone _validate_* function in config_validation.py."
  - id: AC2
    description: "The new check is actually wired into the existing consistency-check aggregator, not just defined and orphaned."
    method: "grep -n '_validate_available_capital\\|available_capital' freqtrade/configuration/config_validation.py — confirm the new function name appears both in its own def and inside validate_config_consistency()'s body (alongside the existing calls to _validate_trailing_stoploss, _validate_unlimited_amount, etc.)."
    expected_result_if_correct: "New function is both defined and called from validate_config_consistency()."
    expected_result_if_trap: "Function defined but never called anywhere, or called from an unrelated location such as configuration/configuration.py's constructor instead of the consistency-check aggregator."
  - id: AC3
    description: "No modules outside the configuration layer were touched."
    method: "git diff --stat against the base commit; confirm every changed path starts with freqtrade/configuration/ (or tests/) and none start with freqtrade/wallets.py, freqtrade/freqtradebot.py, freqtrade/exchange/, freqtrade/strategy/, freqtrade/optimize/, freqtrade/rpc/."
    expected_result_if_correct: "Diff confined to freqtrade/configuration/config_validation.py (+ optional test file)."
    expected_result_if_trap: "Diff touches freqtrade/wallets.py (e.g., adding a check inside get_starting_balance) or freqtrade/freqtradebot.py."
  - id: AC4
    description: "The exception type used matches the file's existing convention."
    method: "grep -n 'raise ' <new function body> — confirm it raises ConfigurationError (imported from freqtrade.exceptions, already imported at the top of the file) if implemented as a hard error, not a custom/new exception class."
    expected_result_if_correct: "raise ConfigurationError(...) using the already-imported exception class."
    expected_result_if_trap: "A new exception class is defined, or a bare `raise Exception(...)`, or only a print() statement with no exception/warning at all."
  - id: AC5
    description: "Wallets.get_starting_balance / get_total_stake_amount behavior (which of the two settings wins) is unchanged."
    method: "git diff freqtrade/wallets.py — must be empty. Additionally run pytest tests/test_wallets.py to confirm no regressions."
    expected_result_if_correct: "No diff to wallets.py; existing wallet tests pass unchanged."
    expected_result_if_trap: "wallets.py modified to change precedence or to raise the new error itself mid-calculation."

notes_for_positive_negative_control: >
  Correct implementation: a new `_validate_available_capital(conf)` function added to
  freqtrade/configuration/config_validation.py, called from validate_config_consistency(), raising
  ConfigurationError when both available_capital is present and tradable_balance_ratio differs from its
  0.99 schema default. A plausible functional-pass/architecture-fail implementation would place the same
  check inside Wallets.get_starting_balance() in freqtrade/wallets.py — this could still "work" in the
  sense that a test starting the bot with both settings set would eventually hit the error (the first time
  get_starting_balance() is called), but it fires late (mid-run, after exchange/strategy initialization)
  rather than at config-load time, uses whatever ad hoc exception/logging style the implementer chose
  instead of the file's established ConfigurationError convention, and duplicates config-shape knowledge
  outside the configuration layer — a second, inconsistent place where config validity is decided.
