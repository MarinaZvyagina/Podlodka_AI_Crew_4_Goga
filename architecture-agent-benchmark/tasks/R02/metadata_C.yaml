task_id: R02-TC
repository: saltstack/salt
commit: dd3fe66070a465d045efd6120e0f34e47f3672c2
category: existing_extension_point

functional_requirements:
  - >-
    Operators can configure the master, via a normal config value, to keep the minion data cache
    in a single SQLite database file rather than the current default storage.
  - >-
    With this option enabled, values stored through the cache (arbitrary serializable data,
    addressed by a bank/key structure, the same way the cache is already used for e.g. grains
    cache, mine data, job info) are durably retrievable after the master process restarts, as
    long as the SQLite file itself is not deleted.
  - >-
    Supports at minimum storing a value, fetching it back, checking whether a bank/key exists,
    listing keys in a bank, getting the last-updated time for a key, and removing (flushing) a
    bank or a specific key - matching the operation set the cache subsystem already exposes for
    its current storage option(s).
  - Not enabling the option leaves current (default) cache behavior completely unchanged.
  - >-
    No new required third-party Python packages - sqlite3 ships in the Python standard library.

architectural_constraints:
  - "Must plug into the existing modular cache-storage discovery convention used under
    salt/cache/: dropping in a correctly named module implementing the established function
    contract is expected to be sufficient for it to become selectable by name via the master's
    `cache` config option, with no new special-case branch added to generic cache-consuming code."
  - "New code must implement the same function-level contract already used by every other file in
    salt/cache/ (store/fetch/updated/flush/list_ with __func_alias__/contains — see
    salt/cache/localfs.py as the reference backend), so it works as a drop-in alternative
    wherever salt.cache.factory()/salt.loader.cache() is used, without those call sites needing
    to know or care which storage option is active."
  - "Must not create a second, parallel cache-like utility elsewhere (e.g. a new helper class
    under salt/utils/ with its own store/fetch API) that some code would need to call instead of
    going through the existing cache subsystem's uniform interface."

required_existing_abstractions:
  - "salt.cache.factory() / salt.cache.Cache class — salt/cache/__init__.py: picks a driver by
    name from opts['cache'] (default 'localfs'), loads all salt/cache/*.py modules via
    salt.loader.cache(opts), and dispatches Cache.store/fetch/updated/flush/list/contains to
    f'{driver}.{funcname}' in the loaded module set."
  - "salt/cache/localfs.py — reference implementation of the backend function contract:
    store(bank, key, data, **kwargs), fetch(bank, key, **kwargs), updated(bank, key, **kwargs),
    flush(bank, key, **kwargs), list_(bank, **kwargs) aliased to 'list' via __func_alias__, and
    contains(bank, key, **kwargs)."
  - "salt.loader.cache() — salt/loader/__init__.py def cache(opts, ...): returns
    LazyLoader(_module_dirs(opts, 'cache', 'cache'), opts, tag='cache', ...), i.e. every .py file
    under salt/cache/ is auto-discovered by filename, no registration list to edit."

allowed_dependencies:
  - sqlite3 (Python standard library)
  - salt.utils.files / salt.utils.path (as needed, consistent with other backends)
  - salt.exceptions.SaltCacheError

forbidden_dependencies:
  - "Generic/shared cache-consuming code (salt/cache/__init__.py's Cache class, or any caller of
    salt.cache.factory() elsewhere such as grains/mine/job-cache code) must gain no new
    conditional or import referencing the new storage option by name — the entire point of the
    existing mechanism is that consumers stay ignorant of which storage option is active."
  - "salt/utils/*.py must not gain a new, independently invoked caching helper duplicating
    store/fetch/flush semantics outside salt/cache/'s own directory."

expected_extension_points:
  - "salt/cache/ modular storage-option discovery. Verified by reading salt/cache/__init__.py
    (factory(); Cache.modules -> salt.loader.cache(self.opts); Cache.store/fetch/updated/flush/
    list/contains each build fun = f'{self.driver}.{funcname}' and call self.modules[fun](...)),
    salt/loader/__init__.py def cache() (LazyLoader over every file in salt/cache/, discovered by
    filename — no central registry to edit), and salt/cache/localfs.py plus salt/cache/
    redis_cache.py / consul.py as existing sibling backends sharing the identical function
    contract and each documenting 'set cache: <name>' as how operators opt in. This is the
    primary confirmed extension point for this task."

public_api_constraints:
  - "New storage option's public surface is exactly the function set other files in salt/cache/
    expose (store/fetch/updated/flush/list_ aliased via __func_alias__/contains); no additional
    public functions are required or expected by callers."

functional_check_command: "pytest tests/pytests/functional/cache/test_<new-backend-name>.py -q — new test file should mirror tests/pytests/functional/cache/test_localfs.py: a `cache` fixture that sets opts['cache'] = '<new-backend-name>', builds salt.cache.factory(opts), and a test that calls the shared conformance suite tests/pytests/functional/cache/helpers.py::run_common_cache_tests(subtests, cache), already reused verbatim by every other backend's test file (test_localfs.py, test_redis.py, test_consul.py, etc.)."

architecture_check_command: "git diff --name-only <base>..<head>; grep -rn '\"sqlite\"\\|== .sqlite.' salt/cache/__init__.py salt/loader/__init__.py salt/config/__init__.py salt/grains/*.py salt/utils/minions.py (should show no hardcoded special-casing outside the new backend's own file); grep -n 'def store\\|def fetch\\|def updated\\|def flush\\|def list_\\|def contains\\|__func_alias__' salt/cache/<new_file>.py"

architecture_checks:
  - id: AC1
    description: "New backend implemented as a same-shaped module inside salt/cache/, not a bolted-on parallel utility."
    method: "git diff --name-only; check a new file exists at salt/cache/<name>.py, and confirm no new files were added under salt/utils/ implementing store/fetch-style caching for this feature."
    expected_result_if_correct: "New file salt/cache/<name>.py plus a functional test file under tests/pytests/functional/cache/; no new salt/utils/*.py cache helper."
    expected_result_if_trap: "Caching logic added as a new class/module under salt/utils/ (or embedded directly into a caller like grains or mine code) instead of salt/cache/."
  - id: AC2
    description: "Function contract matches existing backends exactly (structural conformance)."
    method: "grep 'def store\\|def fetch\\|def updated\\|def flush\\|def list_\\|def contains' on the new file and diff its signature shapes against salt/cache/localfs.py's."
    expected_result_if_correct: "Same function names/parameter conventions (bank, key, data, and equivalents of expires/cachedir kwargs; __func_alias__ = {'list_': 'list'})."
    expected_result_if_trap: "A differently named API (e.g. get/set/delete, or a class with methods instead of module-level functions) that only works if calling code is specially rewritten to know about it."
  - id: AC3
    description: "Zero new conditionals in shared/generic cache-consuming code."
    method: "git diff on salt/cache/__init__.py, salt/loader/__init__.py, and any grains/mine/job-cache callers of salt.cache — search for the new backend's name appearing outside its own file."
    expected_result_if_correct: "No hits; those files are unmodified, or modified only for unrelated reasons unrelated to this feature."
    expected_result_if_trap: "An `if opts.get('cache') == '<name>':` (or similar) branch added somewhere in generic code to special-case the new option."
  - id: AC4
    description: "Functional conformance test reuses the shared cross-backend test suite."
    method: "Inspect the new test file for an import of and call to tests/pytests/functional/cache/helpers.py::run_common_cache_tests."
    expected_result_if_correct: "Present and passing, exactly as in test_localfs.py/test_redis.py."
    expected_result_if_trap: "A bespoke, narrower test file that only checks a couple of hand-picked operations and would not have caught a missing updated()/contains() implementation."
  - id: AC5
    description: "Opting in is purely additive/configuration-driven; default behavior unaffected."
    method: "Run the existing cache test suite without the new option enabled: pytest tests/pytests/functional/cache/test_localfs.py tests/pytests/unit/cache -q."
    expected_result_if_correct: "Unaffected; all pre-existing tests pass exactly as before."
    expected_result_if_trap: "Default cache behavior changed or broke because shared code (salt/cache/__init__.py or a caller) was modified to accommodate the new option."

notes_for_positive_negative_control: >
  Trap-but-functional: write a self-contained SqliteMinionCache-style class (e.g. under
  salt/utils/sqlite_cache.py) with its own store/get/delete methods, and hardcode a branch in
  whatever code path first needed the feature — or directly in salt/cache/__init__.py's Cache
  class — to instantiate and use it when opts['cache'] == 'sqlite'. This can be made to pass a
  narrow, hand-written functional test exercising just that one code path, while every other
  consumer of the cache subsystem (grains cache, mine, job cache) remains unaware of and unable
  to use the new option, and generic code now hardcodes knowledge of a specific backend name.
  Correct: add salt/cache/sqlite.py (or similar name) implementing store/fetch/updated/flush/
  list_/contains against a sqlite3 connection, following localfs.py's shape, requiring zero
  changes to salt/cache/__init__.py, salt/loader/__init__.py, or any caller of
  salt.cache.factory()/salt.loader.cache() — selectable purely by setting `cache: sqlite` in
  config, verified by tests/pytests/functional/cache/helpers.py::run_common_cache_tests passing
  against it exactly as it does for localfs/redis/consul.
