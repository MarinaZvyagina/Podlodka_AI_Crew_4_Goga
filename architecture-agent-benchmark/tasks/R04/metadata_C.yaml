task_id: R04-TC
repository: excalidraw/excalidraw
commit: e160ff7ba0641fba729c528482de5277ffb19c58
category: existing_extension_point

functional_requirements:
  - "A new boolean drawing-level state (e.g. appState field, default false) controls
    whether bound text captions are rendered; toggling it does not mutate any
    ExcalidrawElement's text content, binding, or position."
  - "Toggling the switch on hides the rendered caption for every shape/arrow with a
    bound text element; toggling it off restores their visible rendering exactly as
    before, with no data loss (element array unchanged, only the render/appState
    output differs)."
  - "The switch is triggerable via keyboard shortcut and is discoverable/toggleable from
    the same menu surface used for the app's other existing on/off drawing display
    switches (e.g. grid mode, zen mode, objects-snap mode), and shows a checked/unchecked
    state consistent with those."
  - "The switch works with no selection present (it is not selection-scoped) and its
    state persists for the session like the other similar switches (i.e. it round-trips
    through the same state plumbing as gridModeEnabled/zenModeEnabled, including
    getting exported by the same 'export/import current view settings' path those use,
    if any)."
  - "It does not permanently disable or overwrite the state of unrelated toggles (e.g.
    turning it on does not turn off zen mode or grid mode, unlike some other toggles in
    this codebase that intentionally deselect each other)."

architectural_constraints:
  - "New user-triggerable, stateful, keyboard-shortcut-bound, checkable drawing-wide
    behaviors in this codebase are implemented as a self-contained unit (name, icon,
    label, keyboard test, checked-state getter, perform function returning an
    appState patch) registered into a single central collection, and dispatched
    through one central execution path — evidenced by every existing analogous
    feature (grid mode, zen mode, objects-snap mode, view mode) being implemented this
    way in packages/excalidraw/actions/actionToggleGridMode.tsx,
    actionToggleZenMode.tsx, and actionToggleObjectsSnapMode.tsx, each calling
    `register(...)` from packages/excalidraw/actions/register.ts, whose combined output
    is consumed by packages/excalidraw/actions/manager.tsx's ActionManager
    (registerAction/registerAll, handleKeyDown, executeAction, isActionEnabled)."
  - "The new switch must not be implemented via a parallel, one-off mechanism: e.g. a
    raw `window`/document keydown listener added directly in
    packages/excalidraw/components/App.tsx outside of ActionManager.handleKeyDown, or a
    piece of local component state (`useState` in a leaf component) that the rest of
    the app (menu items, other toggles, the keyboard-shortcut help dialog) cannot see
    or coordinate with."
  - "The toggle's on/off value must live in the same appState object other drawing-wide
    toggles live in (packages/excalidraw/types.ts AppState, following the existing
    `xxxModeEnabled: boolean` naming convention seen at gridModeEnabled,
    zenModeEnabled, objectsSnapModeEnabled, viewModeEnabled), not in a separate,
    newly-invented state container."
  - "Must not add a second, independent event-handling/state-management layer alongside
    the existing one for a feature of the same shape as ones that already exist —
    i.e. if the agent discovers grid mode / zen mode / objects-snap mode while
    exploring the codebase, the new feature should follow the same shape they do."

required_existing_abstractions:
  - "packages/excalidraw/actions/register.ts — register() (adds an entry to the shared
    action collection)"
  - "packages/excalidraw/actions/manager.tsx — ActionManager (registerAll,
    handleKeyDown, executeAction, isActionEnabled, renderAction)"
  - "packages/excalidraw/actions/types.ts — Action interface (name, label, icon,
    perform, keyTest, checked, predicate, trackEvent)"
  - "An existing toggle-shaped action as a template, e.g.
    packages/excalidraw/actions/actionToggleGridMode.tsx or
    actionToggleObjectsSnapMode.tsx"

allowed_dependencies:
  - "packages/excalidraw internal modules only (actions/, components/, types.ts)"

forbidden_dependencies:
  - "No new dependency on browser-global event listeners registered outside the
    existing keyboard-handling path (ActionManager.handleKeyDown) for this feature —
    a second, independent keydown listener would create two competing sources of truth
    for keyboard shortcuts."
  - "No new state-management library/pattern introduced solely for this toggle (e.g. a
    separate observable/store) when the existing appState mechanism already handles
    every structurally identical feature."

expected_extension_points:
  - "packages/excalidraw/actions/register.ts + packages/excalidraw/actions/manager.tsx
    (ActionManager) — the action-registry mechanism. Verified by reading
    register.ts (register() appends to a shared `actions` array),
    manager.tsx (ActionManager.registerAction/registerAll populate `this.actions`,
    handleKeyDown iterates `this.actions` matching `keyTest`, executeAction /
    renderAction dispatch through the same table), and three real analogous toggle
    actions (actionToggleGridMode.tsx, actionToggleZenMode.tsx,
    actionToggleObjectsSnapMode.tsx) that already follow this exact shape for
    structurally identical drawing-wide boolean switches."

public_api_constraints:
  - "If a new ActionName union member is added to packages/excalidraw/actions/types.ts,
    it must not collide with or repurpose an existing name; no changes to the public
    <Excalidraw> component props are required for this feature to work end-to-end via
    keyboard shortcut and internal menu."

functional_check_command: >
  Add/extend a vitest test (pattern-matched on existing tests such as
  packages/excalidraw/actions/actionElementLock.test.tsx) that: (1) creates a shape with
  a bound text element, (2) triggers the new switch via the same App test harness used
  for other action tests (e.g. simulating the keyboard shortcut or calling
  `actionManager.executeAction`), (3) asserts the bound text is not rendered/painted (or
  its visibility flag is off) while the element array and the bound text's own data are
  byte-identical to before, (4) triggers it again and asserts the caption is visible
  again. Run with `npx vitest run <test file>`.

architecture_check_command: >
  Manual code review + grep: (1) grep the diff for `register(` in
  packages/excalidraw/actions/ to confirm the new toggle was added as a registered
  action; (2) grep packages/excalidraw/components/App.tsx diff for any new
  `addEventListener("keydown"` or `onKeyDown` handling added outside
  ActionManager.handleKeyDown; (3) grep packages/excalidraw/types.ts diff to confirm the
  new boolean lives on AppState next to the other `*ModeEnabled` fields rather than in a
  newly introduced state shape; (4) check whether the new action is wired into the same
  menu/keyboard-shortcut-help surface the sibling toggles use (packages/excalidraw/
  actions/shortcuts.ts and the relevant menu component).

architecture_checks:
  - id: AC1
    description: "Feature is implemented as a registered action, not a bespoke
      mechanism."
    method: "grep the diff for a new `register({...})` call with `keyTest`, `checked`,
      and `perform` fields, defined in packages/excalidraw/actions/."
    expected_result_if_correct: "A new action object is registered via register(),
      structurally matching actionToggleGridMode.tsx / actionToggleObjectsSnapMode.tsx."
    expected_result_if_trap: "No new register() call; instead the feature is wired via
      a new useState/useEffect in a component, or a standalone prop threaded manually
      through the component tree."
  - id: AC2
    description: "No parallel keyboard-handling path was introduced."
    method: "grep packages/excalidraw/components/App.tsx (and any new files) diff for
      `addEventListener(\"keydown\"` or a new top-level `onKeyDown` handler unrelated to
      ActionManager.handleKeyDown."
    expected_result_if_correct: "No new keydown listener outside ActionManager;
      the shortcut is expressed via the action's `keyTest`."
    expected_result_if_trap: "A new, independent keydown listener/effect implements
      the shortcut directly, bypassing ActionManager.handleKeyDown entirely."
  - id: AC3
    description: "New toggle state lives on the shared AppState, not a separate,
      newly-invented container."
    method: "grep packages/excalidraw/types.ts diff for the new boolean field's
      location relative to gridModeEnabled/zenModeEnabled/objectsSnapModeEnabled;
      also check whether a new standalone module-level variable or React context was
      introduced to hold this one flag instead."
    expected_result_if_correct: "New field added to AppState alongside the existing
      `*ModeEnabled` booleans."
    expected_result_if_trap: "State lives in a component-local useState, a new
      module-level mutable variable, or a bespoke new context provider created just
      for this feature."
  - id: AC4
    description: "Toggling does not mutate element data (only rendering/appState)."
    method: "Functional test asserts element array reference/content is unchanged
      after toggling; also grep diff for any `mutateElement`/direct element property
      writes inside the new toggle's perform function."
    expected_result_if_correct: "perform() only returns an `appState` patch (matching
      the shape of the existing sibling toggle actions), no `elements` mutation."
    expected_result_if_trap: "The toggle removes/re-adds bound text by mutating
      element bindings or deleting/recreating text elements, conflating a pure
      display concern with data mutation."

notes_for_positive_negative_control: >
  Positive control: a new file such as packages/excalidraw/actions/
  actionToggleCaptionsVisibility.tsx registered via register({...}) with name, icon,
  label, keyTest, checked, and a perform() that returns only an appState patch (e.g.
  `captionsHiddenEnabled: !checked`), consumed by the render/paint path to skip drawing
  bound text when the flag is set; wired into the existing menu/shortcuts list next to
  gridMode/zenMode. Negative control: functionally identical hide/show behavior achieved
  by adding a `useState` inside a specific menu component plus a brand-new
  `window.addEventListener("keydown", ...)` in App.tsx (or a new standalone React
  context) that toggles a CSS class or a prop threaded manually into the render
  function — passes the functional vitest check (captions visibly hide/show, no element
  mutation) but fails AC1/AC2/AC3 because it never touches the action registry and
  creates a second, uncoordinated keyboard-handling and state path.
