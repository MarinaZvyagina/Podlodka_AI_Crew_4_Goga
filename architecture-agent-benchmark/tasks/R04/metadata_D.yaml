task_id: R04-TD
repository: excalidraw/excalidraw
commit: e160ff7ba0641fba729c528482de5277ffb19c58
category: architecture_trap

functional_requirements:
  - "Triggering the command with N shapes selected rounds each selected shape's x, y,
    width, and height independently to the nearest multiple of the drawing's current
    grid step, matching the same rounding used for live drag-snapping."
  - "Triggering the command with nothing selected applies the same snap to every shape
    on the canvas."
  - "Each shape snaps independently based on its own position/size (not as a bounding
    box of the whole selection)."
  - "A single Ctrl+Z / Cmd+Z after the command fully reverts every snapped shape to its
    exact pre-snap x/y/width/height in one step."
  - "The resulting change is visible to a second collaborator/session viewing the same
    drawing (i.e. it propagates through whatever mechanism normal edits use to reach
    collaborators)."

architectural_constraints:
  - "Element position/size must be changed only through the element-mutation entry
    points already used everywhere else in this codebase for exactly this kind of bulk
    geometry update — evidenced by every existing bulk-geometry action (e.g.
    packages/excalidraw/actions/actionAlign.tsx's alignSelectedElements, which calls
    alignElements() in packages/element/src/align.ts, which itself calls
    `scene.mutateElement(element, {...})` — never `element.x = ...` directly) and by
    packages/element/src/mutateElement.ts's own doc comment: direct property
    assignment 'won't trigger the component to update' and bypasses version bumping."
  - "The action's `perform` function must return the updated `elements` and a
    `captureUpdate` value (see packages/excalidraw/actions/types.ts ActionResult and
    packages/element/src/store.ts CaptureUpdateAction), because
    CaptureUpdateAction.IMMEDIATELY is literally what produces an undo/redo-capturable
    history entry (packages/element/src/store.ts: 'IMMEDIATELY ... These updates will
    _immediately_ make it to the local undo / redo stacks'; store.commit /
    ElementsDelta in packages/element/src/delta.ts is what a directly-mutated,
    same-object-reference update would never produce)."
  - "Must not force a re-render through a side channel (e.g. calling setState with an
    unrelated/dummy field, or calling forceUpdate) instead of returning the changed
    elements from the action/update path — this bypasses both the undo stack and the
    collaboration sync path, since remote sync and history both derive from comparing
    before/after `elements`/`appState`, not from 'the screen looks different now'."
  - "Must bump each mutated element's `version`/`versionNonce`/`updated` (which
    `mutateElement`/`scene.mutateElement` do automatically) — these are exactly the
    fields collaboration reconciliation uses to decide whose edit wins and what to
    broadcast; an in-place assignment to x/y/width/height without going through
    mutateElement leaves version/versionNonce unchanged, so the edit is invisible to
    both the undo system and collaborators even though it is visible locally in that
    render pass."

required_existing_abstractions:
  - "packages/element/src/mutateElement.ts — mutateElement() (or
    packages/element/src/Scene.ts — Scene.mutateElement(), the wrapper used by actions
    via `app.scene.mutateElement` / `scene.mutateElement`)"
  - "packages/excalidraw/actions/types.ts — ActionResult { elements, captureUpdate }"
  - "packages/element/src/store.ts — CaptureUpdateAction.IMMEDIATELY"
  - "An existing bulk-geometry action as a template:
    packages/excalidraw/actions/actionAlign.tsx / packages/element/src/align.ts"

allowed_dependencies:
  - "packages/excalidraw -> @excalidraw/element (already a dependency)"
  - "packages/excalidraw -> @excalidraw/common (already a dependency, for any grid-step
    rounding helper)"

forbidden_dependencies:
  - "No direct DOM/canvas-level manipulation of already-rendered shapes to fake the
    visual result (e.g. transforming the canvas rendering rather than the underlying
    element data) — the element data itself must change."
  - "No new dependency from packages/element on packages/excalidraw (the action/command
    plumbing belongs in packages/excalidraw; the geometry snap-to-grid computation may
    live in packages/element next to other geometry helpers, but must not import
    AppState or other excalidraw-layer types to do so)."

expected_extension_points: []

public_api_constraints:
  - "No changes required to the public <Excalidraw> component props."

functional_check_command: >
  Add/extend a vitest test (pattern-matched on packages/excalidraw/actions/
  actionAlign.tsx-style tests or packages/element test files) that: (1) creates 2-3
  shapes at non-grid-aligned positions/sizes, (2) sets a known grid step, (3) selects a
  subset and triggers the new command, (4) asserts each selected shape's x/y/width/height
  is now a multiple of the grid step while unselected shapes are untouched, (5) calls the
  app's undo function once and asserts every snapped shape's x/y/width/height exactly
  equals its pre-snap value. Run with `npx vitest run <test file>`.

architecture_check_command: >
  Manual code review + grep: (1) grep the diff for direct property assignment on
  element objects (`element.x =`, `element.width =`, `el.x =`, etc., or
  `Object.assign(element, ...)`) outside of mutateElement.ts/Scene.ts itself; (2) grep
  the new action's `perform` function for a returned `captureUpdate` field and confirm
  it is `CaptureUpdateAction.IMMEDIATELY` (not omitted, not NEVER); (3) confirm the new
  code calls `mutateElement` / `scene.mutateElement` / `newElementWith` rather than
  mutating in place; (4) re-run the functional undo assertion (AC1 below) since it is
  the most direct behavioral signature of this specific trap.

architecture_checks:
  - id: AC1
    description: "Undo reverts the snap in a single step."
    method: "Functional test: trigger the command, then undo once, and compare each
      previously-snapped shape's x/y/width/height to its pre-snap values."
    expected_result_if_correct: "All snapped shapes exactly match their pre-snap
      x/y/width/height after a single undo."
    expected_result_if_trap: "Undo either does nothing to the snapped shapes (the
      snap was never captured as a history step) or undoes an unrelated prior edit
      instead, because the mutation was never wrapped in
      CaptureUpdateAction.IMMEDIATELY."
  - id: AC2
    description: "No direct in-place property assignment on element objects."
    method: "grep the diff for `.x =`, `.y =`, `.width =`, `.height =` assignments on
      variables typed as ExcalidrawElement (or array elements from `elements`/
      `selectedElements`) outside of mutateElement.ts."
    expected_result_if_correct: "No such direct assignments; all geometry changes flow
      through mutateElement / scene.mutateElement / newElementWith."
    expected_result_if_trap: "The new code loops over selected elements and assigns
      `el.x = snappedX; el.y = snappedY; el.width = snappedW; el.height = snappedH;`
      directly."
  - id: AC3
    description: "version / versionNonce / updated are bumped on every snapped
      element."
    method: "Functional/unit check: capture `element.version` before and after
      triggering the command for each snapped element."
    expected_result_if_correct: "version (and versionNonce) increased for every
      snapped element, matching what mutateElement produces."
    expected_result_if_trap: "version/versionNonce are unchanged after the visual
      snap, because the element was mutated in place without going through
      mutateElement, or a new element object was constructed but without incrementing
      version."
  - id: AC4
    description: "The action returns a captureUpdate of IMMEDIATELY (or equivalent
      history-capturing return), not a bare re-render trigger."
    method: "grep the new action/handler's return value / call site for
      `captureUpdate: CaptureUpdateAction.IMMEDIATELY` versus a `setState`/
      `forceUpdate` call with no `elements`/`captureUpdate` involved."
    expected_result_if_correct: "perform() returns `{ elements: <snapped elements>,
      captureUpdate: CaptureUpdateAction.IMMEDIATELY, appState }` (or the command is
      routed into `updateScene`/the store commit path with an equivalent effect)."
    expected_result_if_trap: "The handler mutates elements and calls a bare re-render
      (e.g. `this.setState({})`, `this.forceUpdate()`, or reassigns
      `this.scene.getElementsIncludingDeleted()` results without going through
      replaceAllElements/store.commit)."

notes_for_positive_negative_control: >
  Positive control: a new action (e.g. actionSnapSelectionToGrid) whose perform()
  computes each target element's snapped x/y/width/height, applies them via
  `app.scene.mutateElement(element, { x: snappedX, y: snappedY, width: snappedW,
  height: snappedH })` for each element (mirroring alignSelectedElements in
  actionAlign.tsx / align.ts), and returns `{ elements, captureUpdate:
  CaptureUpdateAction.IMMEDIATELY }`. Negative control: a button handler that computes
  the same snapped values but does `selectedElements.forEach(el => { el.x = snappedX;
  el.y = snappedY; el.width = snappedW; el.height = snappedH; })` directly on the
  element objects and then calls `this.setState({})` (or otherwise forces a re-render)
  to make the change visible — the shapes visibly move to grid-aligned positions and a
  naive "do the shapes look snapped" functional test passes, but undo does nothing,
  version/versionNonce never change, and the edit would not propagate to collaborators,
  since no ElementsDelta/history entry and no versioned element update was ever
  produced.
