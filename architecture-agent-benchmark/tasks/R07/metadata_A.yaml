task_id: R07-TA
repository: mihonapp/mihon
commit: ac249e3668a57f24782a49218834064459ba2d09
category: local_change

functional_requirements:
  - Adding a custom extension repository with a non-http(s) URL (e.g. "not a url", "ftp://x",
    "javascript:alert(1)", empty string) is rejected before any network call is attempted, and the
    existing settings dialog surfaces a human-readable error message (not a raw network exception).
  - Adding a well-formed http:// or https:// URL continues to work exactly as before (network
    fetch attempted, repository added on success).
  - No change in behavior for the already-existing repository refresh/remove flows.

architectural_constraints:
  - "Validation must live in the domain layer, at or before the point where
    mihon.domain.extension.interactor.AddExtensionStore invokes
    mihon.domain.extension.repository.ExtensionStoreRepository.insert(indexUrl) —
    domain/src/main/java/mihon/domain/extension/interactor/AddExtensionStore.kt. It must not be
    pushed down into data/src/main/java/mihon/data/extension/repository/ExtensionStoreRepositoryImpl.kt
    or data/src/main/java/mihon/data/extension/service/ExtensionStoreService.kt (those perform the
    actual network fetch, not validation) — the point of catching bad input before the network
    call is that the domain interactor short-circuits before repository.insert() is even called."
  - "Must not require any changes to the existing UI screen/dialog code or
    ExtensionStoresViewModel's error-handling path
    (app/src/main/java/eu/kanade/presentation/more/settings/screen/browse/ExtensionStoresViewModel.kt)
    — that ViewModel already forwards `throwable.message` from a failed Result to the dialog's
    errorMessage field (see its `.onFailure { throwable -> dialog.update { ... errorMessage =
    throwable.message ?: \"unknown error\" } } }`), so a validation failure returned as
    Result.failure(...) from the interactor is sufficient to reach the user with no
    presentation-layer change needed."
  - "No changes to the extension_store SQLDelight schema
    (data/src/main/sqldelight/tachiyomi/data/extension_store.sq) are needed or expected."

required_existing_abstractions:
  - "mihon.domain.extension.interactor.AddExtensionStore —
    domain/src/main/java/mihon/domain/extension/interactor/AddExtensionStore.kt: the sole call
    site that turns a user-entered indexUrl string into a Result<Unit> by delegating to
    ExtensionStoreRepository.insert(indexUrl); currently a bare pass-through with no validation."

allowed_dependencies:
  - domain module only (Kotlin stdlib / java.net.URI or a manual string check; no new external
    dependency needed)

forbidden_dependencies:
  - "domain must not gain a new dependency on Android-runtime URL-parsing classes (e.g.
    android.util.Patterns) that would break domain's plain-JVM unit testability —
    domain/build.gradle.kts currently only depends on projects.sourceApi and projects.core.common;
    prefer java.net.URI/URL or manual scheme checks that run under plain JUnit."
  - "data module (ExtensionStoreRepositoryImpl / ExtensionStoreService) must not gain new,
    duplicate validation logic — validation should exist in exactly one place (the interactor)."

expected_extension_points: []

public_api_constraints:
  - "AddExtensionStore.invoke(indexUrl: String): Result<Unit> signature must not change —
    ExtensionStoresViewModel.createRepo already calls addExtensionStore(baseUrl) and
    pattern-matches onSuccess/onFailure on the returned Result."

functional_check_command: >
  No existing automated test covers this interactor (repo has only ~7 unit test files total,
  none for extensions). The expected functional validator is a new JUnit test file
  domain/src/test/java/mihon/domain/extension/interactor/AddExtensionStoreTest.kt (mirroring the
  style of the existing domain/src/test/java/tachiyomi/domain/release/interactor/GetApplicationReleaseTest.kt),
  asserting Result.isFailure for inputs like "", "not a url", "javascript:alert(1)",
  "ftp://example.com/repo", and that a valid "https://example.com/repo.json" reaches a
  fake/mocked ExtensionStoreRepository.insert() call. Run via
  `./gradlew :domain:testDebugUnitTest --tests mihon.domain.extension.interactor.AddExtensionStoreTest`.

architecture_check_command: >
  grep -n "class AddExtensionStore" -A 15
  domain/src/main/java/mihon/domain/extension/interactor/AddExtensionStore.kt ; grep -rn
  "indexUrl" data/src/main/java/mihon/data/extension/repository/ExtensionStoreRepositoryImpl.kt
  data/src/main/java/mihon/data/extension/service/ExtensionStoreService.kt (expect no new
  scheme/URL-validation logic added there) ; git diff --stat <base>..<head> (expect changes
  confined to domain/, optionally a new domain test file — no changes under data/ or
  app/src/main/java/eu/kanade/presentation/).

architecture_checks:
  - id: AC1
    description: Validation happens in the domain interactor, not the data layer.
    method: "Manual review of the diff to AddExtensionStore.kt: confirm the function returns
      Result.failure(...) for invalid input without calling repository.insert(); grep for any new
      URL-scheme checks added to ExtensionStoreRepositoryImpl.kt / ExtensionStoreService.kt
      (should be none)."
    expected_result_if_correct: "All new validation logic lives in
      domain/src/main/java/mihon/domain/extension/interactor/AddExtensionStore.kt (or a small
      helper it calls within the domain module); repository.insert() is only reached for
      syntactically valid http(s) URLs."
    expected_result_if_trap: "Validation logic added inside ExtensionStoreRepositoryImpl.insert()
      or ExtensionStoreService.fetch() (data layer), or duplicated in both places."
  - id: AC2
    description: No new Gradle module dependency edges introduced.
    method: "diff domain/build.gradle.kts, data/build.gradle.kts, app/build.gradle.kts against
      the base commit."
    expected_result_if_correct: "No changes to any build.gradle.kts project(...) / projects.*
      dependency declarations."
    expected_result_if_trap: "domain/build.gradle.kts gains a new dependency (e.g. on
      core-metadata or app) to reach some URL-validation utility that wasn't needed."
  - id: AC3
    description: Presentation layer (ExtensionStoresViewModel and its Screen/Composable) is
      untouched.
    method: "git diff --name-only, check for changes to
      app/src/main/java/eu/kanade/presentation/more/settings/screen/browse/ExtensionStoresViewModel.kt
      and any related ExtensionStoresScreen*.kt files."
    expected_result_if_correct: "Zero diff in these files — the existing
      `onFailure { errorMessage = throwable.message }` path already surfaces the new validation
      error without modification."
    expected_result_if_trap: "New error-message-formatting or validation logic added inside the
      ViewModel or Composable (duplicating/bypassing the interactor-level check)."
  - id: AC4
    description: Public function signature of AddExtensionStore is unchanged.
    method: "grep -n 'operator fun invoke'
      domain/src/main/java/mihon/domain/extension/interactor/AddExtensionStore.kt"
    expected_result_if_correct: "Signature remains `suspend operator fun invoke(indexUrl:
      String): Result<Unit>`."
    expected_result_if_trap: "Signature changed (e.g. added a Boolean/enum parameter, or a new
      exception type thrown instead of Result), forcing changes to call sites outside domain."

notes_for_positive_negative_control: >
  Positive control: AddExtensionStore.invoke validates the URL scheme/format first (e.g. via
  java.net.URI or a regex) and returns Result.failure(IllegalArgumentException(...)) for
  non-http(s)/malformed input before touching the repository; repository.insert() is called only
  for valid URLs. Negative control (functionally passes, architecturally wrong): the same
  validation is implemented instead inside ExtensionStoreRepositoryImpl.insert() (data layer) or
  duplicated inside ExtensionStoresViewModel (presentation layer) — user-visible behavior is
  identical (bad URLs still get rejected with a message, so functional checks pass), but the
  domain interactor remains a thin unguarded pass-through, violating the expectation that domain
  owns business-rule validation rather than the data/network layer or the UI layer.
