task_id: R09-TB
repository: mozilla-mobile/firefox-ios
commit: de940072da700c2af7d74348b5775674d106d503
category: cross_module_feature

functional_requirements:
  - "A third case is added to NavigationBarMiddleButtonType (firefox-ios/Client/Frontend/Browser/Toolbars/Redux/NavigationBarState.swift), e.g. `.closeTab`, alongside the existing `.home` and `.newTab`, with its own `label` and `imageName`."
  - "The new option is selectable wherever the existing two are surfaced to the user (Settings > Appearance navigation-toolbar picker) and its raw value is persisted via the same Prefs key already used for this setting (PrefsKeys.Settings.navigationToolbarMiddleButton, read/written in ToolbarMiddleware and the corresponding Settings view/view model) so it survives app relaunch, matching how `.home`/`.newTab` already persist."
  - "When the middle button is configured as Close Tab and the user taps it, the currently active tab is closed."
  - "Tapping the Close-Tab middle button is recorded via ToolbarTelemetry (firefox-ios/Client/Frontend/Browser/Toolbars/ToolbarTelemetry.swift), following the same per-button-type recording pattern already used for homeButtonTapped / oneTapNewTabButtonTapped."
  - "Existing Home and New Tab middle-button behaviour, persistence, and telemetry are unchanged."

architectural_constraints:
  - "The tap must be dispatched and handled through the existing Redux chain (Action -> Middleware -> Reducer -> Store), not implemented as a direct imperative call from a view/button target into tab-management code. Concretely: the middle button's tap handler in ToolbarMiddleware (handleToolbarButtonTapActions / the middle-button wiring inside NavigationBarState.getMiddleButtonAction and ToolbarMiddleware) must dispatch a Redux action (e.g. reuse the existing GeneralBrowserActionType.didCloseTabFromToolbar case already declared in GeneralBrowserAction.swift, or an equivalent Action) rather than the view layer calling TabManager/BrowserViewController tab-closing methods directly."
  - "The new middle-button option's persisted value must be read from Prefs inside the Redux Middleware layer (ToolbarMiddleware), exactly where `.home`/`.newTab` are already read via prefs.stringForKey(PrefsKeys.Settings.navigationToolbarMiddleButton) — not read ad hoc from a view controller or view model that bypasses the middleware."
  - "No new dependency edge from BrowserKit (ToolbarKit/Common) back into Client-app-specific types (e.g. TabManager, BrowserViewController) should be introduced; BrowserKit's ToolbarKit renders the generic ToolbarElement/ToolbarActionConfiguration model it already supports and should not need feature-specific knowledge of 'close tab'."
  - "Telemetry recording must go through ToolbarTelemetry, not ad hoc GleanMetrics calls scattered in the tap handler or view layer."

required_existing_abstractions:
  - "NavigationBarMiddleButtonType enum, firefox-ios/Client/Frontend/Browser/Toolbars/Redux/NavigationBarState.swift"
  - "ToolbarMiddleware.getMiddleButtonAction(url:isPrivateMode:middleButton:) and the prefs-reading logic in ToolbarMiddleware, firefox-ios/Client/Frontend/Browser/Toolbars/Redux/ToolbarMiddleware.swift"
  - "GeneralBrowserAction / GeneralBrowserActionType.didCloseTabFromToolbar, firefox-ios/Client/Frontend/Browser/BrowserViewController/Actions/GeneralBrowserAction.swift"
  - "ToolbarTelemetry, firefox-ios/Client/Frontend/Browser/Toolbars/ToolbarTelemetry.swift"
  - "PrefsKeys.Settings.navigationToolbarMiddleButton (existing Prefs key already used for this exact setting)"

allowed_dependencies:
  - "Client Settings module -> Client Prefs (existing)"
  - "Client Redux Toolbar slice (Action/Middleware/Reducer) -> Client Prefs (existing pattern, e.g. translationsFeature flag already read this way)"
  - "Client Redux Toolbar slice -> ToolbarKit (BrowserKit) via the existing generic ToolbarElement/ToolbarActionConfiguration mapping (NavigationToolbarContainerModel)"
  - "Client Redux Toolbar slice -> ToolbarTelemetry (existing)"

forbidden_dependencies:
  - "ToolbarKit (BrowserKit) -> TabManager or any other Client-app-specific tab-management type: BrowserKit must stay app-agnostic; 'close tab' semantics belong in Client's Redux/middleware layer, not in the shared UI library."
  - "View/UI layer (ToolbarKit views, AddressToolbarContainer, NavigationToolbarContainer) -> direct calls into TabManager or BrowserViewController bypassing store.dispatch — this would defeat the point of the Redux chain already used for every other toolbar button."

expected_extension_points: []

public_api_constraints:
  - "No changes to ToolbarKit's public API (ToolbarElement, NavigationToolbarConfiguration, etc.) should be necessary — the feature is expressible entirely through existing generic configuration (icon name, label, tap callback)."

functional_check_command: "This task's correct solution lives entirely in firefox-ios/Client (the main app target), which depends on Mozilla's private Bitrise CI for its test suite and cannot be independently built/tested via plain `swift test`. Functional correctness (Settings picker shows 3 options, choice persists across relaunch, tapping closes the active tab, telemetry fires) must be verified by manual code review of the diff plus (if a macOS/Xcode environment with the Fennec scheme is available) `fxios test` per AGENTS.md; it is not verifiable through the BrowserKit-only `swift test` path."
architecture_check_command: "Manual code review of the diff: (1) grep for new `case .closeTab` (or equivalent) across NavigationBarState.swift, confirm label/imageName added; (2) grep ToolbarMiddleware.swift for the new case's prefs-decoding and dispatch call; (3) confirm no new imports of TabManager/BrowserViewController types inside BrowserKit/Sources/ToolbarKit/**; (4) grep ToolbarTelemetry.swift for a new closeTab-analogous recording method and confirm it's invoked from ToolbarMiddleware's tap handler, not from a View/ViewController."

architecture_checks:
  - id: AC1
    description: "New middle-button option is modeled as a case of the existing NavigationBarMiddleButtonType enum, not a parallel ad hoc mechanism."
    method: "grep -n 'enum NavigationBarMiddleButtonType' -A 15 firefox-ios/Client/Frontend/Browser/Toolbars/Redux/NavigationBarState.swift"
    expected_result_if_correct: "Enum has three CaseIterable cases (home, newTab, closeTab-or-similar), each with label and imageName."
    expected_result_if_trap: "A separate boolean flag or a new unrelated type is introduced to represent the third option instead of extending the enum, duplicating the switch logic already present in getMiddleButtonAction."
  - id: AC2
    description: "Tap handling dispatches through Redux (Action -> Middleware -> Store), reusing or extending the existing action vocabulary, rather than the view layer calling tab-closing code directly."
    method: "grep -n 'didCloseTabFromToolbar\\|closeTab' firefox-ios/Client/Frontend/Browser/Toolbars/Redux/ToolbarMiddleware.swift firefox-ios/Client/Frontend/Browser/BrowserViewController/Actions/GeneralBrowserAction.swift; also grep BrowserKit/Sources/ToolbarKit for any new TabManager-shaped closure added directly to a view."
    expected_result_if_correct: "ToolbarMiddleware's button-tap handling dispatches a GeneralBrowserAction with actionType .didCloseTabFromToolbar (or an equivalent new Redux action) via store.dispatch(...)."
    expected_result_if_trap: "The onSelected/tap closure built in NavigationToolbarContainerModel or a ToolbarKit view directly calls into TabManager/BrowserViewController's tab-closing method, bypassing store.dispatch."
  - id: AC3
    description: "Persistence uses the existing Prefs key and is read in the middleware layer, not duplicated."
    method: "grep -n 'PrefsKeys.Settings.navigationToolbarMiddleButton' across the diff; must appear exactly where the existing read/write for home/newTab already happens (no new parallel Prefs key)."
    expected_result_if_correct: "Same Prefs key, same read site in ToolbarMiddleware, same write site in the Settings screen."
    expected_result_if_trap: "A brand-new Prefs key or UserDefaults access is introduced specifically for the close-tab case, or the value is cached in a singleton/static instead of Prefs."
  - id: AC4
    description: "No new dependency edge from BrowserKit's ToolbarKit target to Client-app types."
    method: "grep -rn 'import Client\\|TabManager\\|BrowserViewController' BrowserKit/Sources/ToolbarKit/"
    expected_result_if_correct: "No matches — BrowserKit/Sources/ToolbarKit/ remains app-agnostic."
    expected_result_if_trap: "ToolbarKit gains an import of or reference to a Client-app-specific type to special-case the close-tab button's rendering or behaviour."
  - id: AC5
    description: "Telemetry for the new button reuses ToolbarTelemetry rather than being recorded ad hoc."
    method: "grep -n 'func .*ButtonTapped' firefox-ios/Client/Frontend/Browser/Toolbars/ToolbarTelemetry.swift; grep for its call site."
    expected_result_if_correct: "A new method analogous to homeButtonTapped/oneTapNewTabButtonTapped is added to ToolbarTelemetry and called from ToolbarMiddleware's tap-handling switch."
    expected_result_if_trap: "GleanMetrics.Toolbar.* is called directly from a view, view model, or inline in a closure outside ToolbarTelemetry/ToolbarMiddleware."

notes_for_positive_negative_control: >
  Positive control: add `.closeTab` to NavigationBarMiddleButtonType with label/imageName, extend
  getMiddleButtonAction's switch, extend the Settings picker's CaseIterable-driven list (no new picker
  code needed since it already iterates allCases), keep reading/writing the same Prefs key, and on tap
  have ToolbarMiddleware dispatch GeneralBrowserActionType.didCloseTabFromToolbar via store.dispatch,
  recording the tap via a new ToolbarTelemetry method. Negative control (compiles, "works" when manually
  tapped, but architecturally wrong): hard-code a third UISegmentedControl-style option in the Settings
  screen that writes to a brand-new UserDefaults key not wired through PrefsKeys, and wire the toolbar
  button's tap directly to `tabManager.removeTab(...)` from inside the ToolbarKit view/delegate callback
  (or from NavigationToolbarContainerModel) instead of dispatching a Redux action — this produces working
  tab-closing behavior but bypasses Middleware, breaks state consistency for other Redux subscribers, and
  creates exactly the "view mutates app state/behaviour directly instead of going through Store" pattern
  this repository's own architecture (and ADR 0004/0005) explicitly moved away from.
