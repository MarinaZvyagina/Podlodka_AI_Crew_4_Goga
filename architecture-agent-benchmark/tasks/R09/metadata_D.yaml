task_id: R09-TD
repository: mozilla-mobile/firefox-ios
commit: de940072da700c2af7d74348b5775674d106d503
category: architecture_trap

functional_requirements:
  - "After the user invokes the existing 'Copy Address' action (copyAddressAction, defined in firefox-ios/Client/Frontend/Browser/BrowserViewController/Views/BrowserViewController.swift, which already copies the current tab's URL to the pasteboard via UIPasteboard.general.url), a brief confirmation message is shown to the user."
  - "The confirmation disappears on its own after a short delay, with no required user interaction to dismiss it (matching the behaviour of the existing bookmark-added confirmation)."
  - "The existing copy-to-pasteboard behaviour of copyAddressAction (setting UIPasteboard.general.url to the canonical/current URL and returning true) is unchanged."
  - "No regression to other toasts/confirmations already shown elsewhere in the app (bookmark added, cookies cleared, removed from reading list, etc.)."

architectural_constraints:
  - "The confirmation must be produced by dispatching a Redux action and rendered as a reaction to state, following the pattern this codebase already documents in code: BrowserViewController.swift contains the explicit in-repo comment 'New toasts should be piped through Redux' (near the legacy 'AddedToShortcutsToast' helper), and the existing toast pipeline is: a case is added to ToastType (firefox-ios/Client/Frontend/Browser/ToastType.swift) -> a GeneralBrowserAction is dispatched with actionType .showToast and toastType: <the new case> (firefox-ios/Client/Frontend/Browser/BrowserViewController/Actions/GeneralBrowserAction.swift) -> the BrowserViewControllerState reducer sets state.toast = toastType -> BrowserViewController.newState(state:) observes state.toast and calls showToastType(toast:), which presents the actual toast view."
  - "The toast must NOT be presented by calling BrowserViewController's toast-presentation helpers (show(toast:), showPlainToast(message:), constructing a PlainToast/ButtonToast, etc.) directly from inside the copyAddressAction closure or any other view/action-handler code path that does not go through store.dispatch(...) and newState(state:) — this is the specific anti-pattern the codebase's own comments and architecture already warn against, even though a small number of legacy call sites doing exactly this still exist elsewhere in BrowserViewController.swift."
  - "Whatever code path triggers the toast must go through the same GeneralBrowserActionType.showToast action type already used for every other Redux-driven toast, not a new bespoke action/mechanism."

required_existing_abstractions:
  - "ToastType enum, firefox-ios/Client/Frontend/Browser/ToastType.swift"
  - "GeneralBrowserAction / GeneralBrowserActionType.showToast, firefox-ios/Client/Frontend/Browser/BrowserViewController/Actions/GeneralBrowserAction.swift"
  - "BrowserViewControllerState.toast field and its reducer handling (around the case that reads action.toastType and does .copy(toast: toastType)), firefox-ios/Client/Frontend/Browser/BrowserViewController/State/BrowserViewControllerState.swift"
  - "BrowserViewController.newState(state:) / showToastType(toast:), firefox-ios/Client/Frontend/Browser/BrowserViewController/Views/BrowserViewController.swift"

allowed_dependencies:
  - "copyAddressAction handler (or wherever 'copy address' is triggered) -> store.dispatch(GeneralBrowserAction(...)) (existing pattern used by every other Redux-driven browser action)"

forbidden_dependencies:
  - "copyAddressAction handler -> BrowserViewController.show(toast:) / showPlainToast(...) / direct instantiation of PlainToast/ButtonToast — bypassing store.dispatch and state.toast entirely."

expected_extension_points: []

public_api_constraints:
  - "No changes to the copyAddressAction's existing return type/behaviour (still an AccessibleAction returning Bool and copying the URL)."

functional_check_command: "This task's correct solution lives entirely in firefox-ios/Client (the main app target), which depends on Mozilla's private Bitrise CI for its test suite and is not independently testable via plain `swift test`. Functional correctness (toast appears after Copy Address, auto-dismisses, pasteboard behaviour unchanged) must be verified by manual code review of the diff plus, where an Xcode/Fennec environment is available, `fxios test` per AGENTS.md."
architecture_check_command: "Manual code review is the primary method (this is the central check for this task): (1) locate the code that triggers the new toast and confirm it goes through store.dispatch(GeneralBrowserAction(..., actionType: GeneralBrowserActionType.showToast)) rather than calling show(toast:)/showPlainToast directly; (2) grep -n 'case .copyURL\\|case .copyAddress' firefox-ios/Client/Frontend/Browser/ToastType.swift to confirm a new ToastType case was added; (3) grep -n 'show(toast:\\|showPlainToast' around the copyAddressAction closure specifically (not just anywhere in the 5000+ line file, where several legacy direct calls already pre-exist and are not themselves violations introduced by this task) to confirm no new direct call was added there."

architecture_checks:
  - id: AC1
    description: "A new ToastType case exists for the copy-address confirmation."
    method: "grep -n 'enum ToastType' -A 12 firefox-ios/Client/Frontend/Browser/ToastType.swift"
    expected_result_if_correct: "A new case (e.g. .copyURL) is added with an appropriate `title` string in the existing switch."
    expected_result_if_trap: "No new ToastType case exists; instead a raw string/UIAlertController/custom view is built ad hoc at the call site."
  - id: AC2
    description: "The toast is triggered via store.dispatch(...) with GeneralBrowserActionType.showToast, not via a direct UI call from the copyAddressAction handler."
    method: "Locate the (possibly modified) copyAddressAction closure in BrowserViewController.swift (or wherever the 'copy address' trigger now lives) and read its body line by line."
    expected_result_if_correct: "The closure body ends with (or includes) `store.dispatch(GeneralBrowserAction(toastType: .copyURL, windowUUID: windowUUID, actionType: GeneralBrowserActionType.showToast))` (or equivalent), with no direct toast-presentation call."
    expected_result_if_trap: "The closure body directly constructs a toast (e.g. `let toast = PlainToast(...); show(toast: toast)` or `showPlainToast(message: ...)`) inline, mirroring the pre-existing legacy call sites elsewhere in the file (e.g. around the quick-tab-switch or clipboard-bar toasts) instead of going through Redux."
  - id: AC3
    description: "The reducer path for state.toast is reused unmodified, not duplicated."
    method: "diff the toast-handling case in BrowserViewControllerState's reducer against the pinned-commit version."
    expected_result_if_correct: "No changes to the existing `guard let toastType = action.toastType ... .copy(toast: toastType)` reducer logic — the new case flows through it unchanged."
    expected_result_if_trap: "A new, separate reducer branch or a new state field (e.g. `var copyAddressToastVisible: Bool`) is introduced specifically for this one toast, duplicating what `toast: ToastType?` already generically supports."
  - id: AC4
    description: "showToastType(toast:) in BrowserViewController handles the new case (explicitly or via its `default:` branch) rather than a second, parallel presentation path being added."
    method: "grep -n 'func showToastType' -A 25 firefox-ios/Client/Frontend/Browser/BrowserViewController/Views/BrowserViewController.swift"
    expected_result_if_correct: "The new ToastType case is presented by the existing showToastType(toast:) switch (either falling into its `default:` ButtonToast branch or getting an explicit `showPlainToast` case, consistent with how other simple confirmations like .clearCookies are handled) — no second toast-rendering function is introduced."
    expected_result_if_trap: "A brand-new, separate presentation method (e.g. `showCopyAddressConfirmation()`) is added and called directly from the action handler, parallel to and bypassing showToastType(toast:)."

notes_for_positive_negative_control: >
  Positive control: add `case copyURL` to ToastType (with a `title` string), and change the
  copyAddressAction handler in BrowserViewController.swift so that after
  `UIPasteboard.general.url = url` it calls
  `store.dispatch(GeneralBrowserAction(toastType: .copyURL, windowUUID: windowUUID, actionType: GeneralBrowserActionType.showToast))`
  instead of returning immediately — the existing reducer sets state.toast, and the existing
  newState(state:) -> showToastType(toast:) machinery (already wired for every other toast) displays it
  with zero new presentation code. Negative control (visibly identical to the user, architecturally wrong):
  leave copyAddressAction's dispatch-free structure alone and instead have its closure directly build and
  present a toast in place, e.g. `let viewModel = ButtonToastViewModel(labelText: "Address Copied"); let t = ButtonToast(viewModel: viewModel, theme: currentTheme(), completion: nil); show(toast: t)` (or
  `showPlainToast(message: "Address Copied")`) called straight from the AccessibleAction handler. This
  compiles, the toast visibly appears and disappears exactly like the correct version to a manual tester,
  but it bypasses store.dispatch/state.toast/newState entirely, contradicting the explicit in-repo guidance
  ("New toasts should be piped through Redux") and making this piece of UI state invisible to Redux
  subscribers, undo/redo-style state reconstruction, and future consumers of BrowserViewControllerState.
