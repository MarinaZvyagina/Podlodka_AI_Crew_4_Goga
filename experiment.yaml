# experiment.yaml
# Machine-readable experiment configuration.
# Status: FROZEN at Phase 7 (benchmark-v1 tag). All fields resolved; no more TBDs.
# Post-freeze changes must be logged as an amendment in PROTOCOL.md, never a silent edit.

meta:
  name: architecture-agent-benchmark
  version: v1-frozen
  created: "2026-08-25"
  frozen_at_phase_7: "2026-08-26"
  research_source: Research.md
  hypothesis_document: TREATMENT_DESIGN.md
  protocol_document: PROTOCOL.md

design:
  repositories: 10
  tasks_per_repository: 4
  conditions: 2
  repetitions_per_cell: 10
  total_experimental_cells: 80          # 10 repos * 4 tasks * 2 conditions
  total_unique_tasks: 40                # 10 repos * 4 tasks
  total_runs: 800

task_types:
  - id: A
    name: local_change
  - id: B
    name: cross_module_feature
    min_architectural_boundaries: 2
    preferred_architectural_boundaries: 3
  - id: C
    name: existing_extension_point
  - id: D
    name: architecture_trap

conditions:
  baseline:
    label: B
    description: >
      Repository exactly as it exists (source, README, CONTRIBUTING, architecture docs,
      ADRs, AGENTS.md, CLAUDE.md, repository rules, comments, tests, module docs).
      Nothing removed, nothing added.
    goga_cli_available: false
    goga_skills_connected: false
  goga:
    label: G
    description: >
      Identical repository plus a frozen CODEMANIFEST architecture forest and one static
      pointer file (ARCHITECTURE_CONTRACTS.md), as scoped in TREATMENT_DESIGN.md section 2.
      No Goga CLI, skills, slash commands, or multi-stage SDD workflow during the
      benchmark session itself.
    goga_cli_available: false
    goga_skills_connected: false
    treatment_artifacts:
      - CODEMANIFEST forest (frozen per repository before randomization)
      - ARCHITECTURE_CONTRACTS.md (single static pointer file, identical template)

goga_tooling:
  # Used ONLY during repository-level architecture-forest preparation (Phase 8),
  # never during the 800 task-solving runs themselves. See TREATMENT_DESIGN.md section 4.
  repo: qarium/goga
  pinned_tag: v1.2.2
  pinned_commit: f1257db59347651273ce94d4988e16d8fa1e7940
  research_document: GOGA_RESEARCH.md
  supported_contract_languages: [python, go, kotlin, swift, javascript]

environment:
  claude_code_version: "2.1.202"        # captured 2026-08-25; re-verify at Phase 1 freeze
  model:
    requested_model: "claude-sonnet-5"   # explicit identifier, NOT the floating "sonnet" alias
                                          # used by mistake during the Phase 6 pilot; confirmed
                                          # accepted directly by the CLI (`--model claude-sonnet-5`)
    pinning_policy: "prefer pinned dated model version over floating alias; log actual_model per run"
    pinning_note: >
      No further-dated snapshot identifier (e.g. a YYYYMMDD-suffixed model string) was exposed
      by this Claude Code installation at protocol-freeze time; "claude-sonnet-5" is the most
      specific identifier available. If Anthropic exposes a dated snapshot alias before Phase 10
      execution, prefer it and record the change as a pre-execution amendment, not silently.
  execution_machine: "Apple Silicon (arm64), macOS (Darwin), 10 CPU cores, 16GB RAM"  # from Phase 5 sysctl probe
  docker_version: "29.6.2"
  python_version: "3.14.6"
  jdk_version: "21 (NOT 26)"            # see finding below; installed via `brew install openjdk@21`
  jdk_version_finding: >
    JDK 26 (initially installed) builds mihonapp/mihon successfully but breaks
    signalapp/Signal-Android's Robolectric unit tests with "Unsupported class file major
    version 70" (Robolectric's bundled ASM can't parse JDK 26 bytecode). Discovered during
    Phase 5 control verification for R08. JDK 21 must be pinned for both Kotlin
    repositories before Phase 6, and Mihon must be re-verified to still build under JDK 21.
  android_sdk: "cmdline-tools, licenses accepted; platforms 34/35; build-tools 34.0.0/35.0.0"
  cocoapods_version: "1.17.0"            # required for R10 (Signal-iOS) dependency resolution
  network_policy: >
    No OS-level network sandbox is enforced in this environment (documented limitation, not a
    silent gap — see PROTOCOL.md section 20 / threats to validity). Agents have unrestricted
    outbound network access, needed for legitimate dependency resolution (PyPI, npm, Go module
    proxy, Maven/Gradle, CocoaPods, GitHub release binaries). Both conditions get identical
    network access; this is not a between-condition confound.
  tool_permissions: >
    `claude -p <task_prompt> --permission-mode bypassPermissions --model claude-sonnet-5
    --output-format json --no-session-persistence --max-budget-usd 8`. bypassPermissions is
    required for genuine no-manual-rescue autonomous execution (confirmed working in Phase 6
    pilot) and is applied identically to both conditions.
  max_budget_usd_per_run: 8              # generous vs. Phase 6 pilot's observed $0.73-$2.27 for
                                          # the simplest task type; bounds worst-case runaway cost
                                          # for the harder B/C/D task types without constraining
                                          # normal completions
  timeout_seconds: 3600                  # 60 min; pilot Task A runs took 280-670s, B/C/D (cross-
                                          # module/extension-point/architecture-trap) are expected
                                          # to run longer given more exploration and iteration
  dependency_state: "vendored/locked at repository commit; no floating dependency resolution"

randomization:
  method: blocked_randomized_order
  unit: "repository x task x repetition"
  levels: [baseline_then_goga, goga_then_baseline]
  random_seed: 42                        # arbitrary but fixed; recorded here so experiment_plan.csv
                                          # generation is exactly reproducible by a third party
  plan_file: experiment_plan.csv
  plan_mutable_after_start: false

metrics:
  correctness:
    - functional_success
    - full_architecture_conformance
    - architecture_conformance_rate
    - dangerous_success
    - existing_test_regressions
  agent_activity:
    - input_tokens
    - output_tokens
    - total_tokens
    - tool_calls
    - shell_commands
    - searches
    - file_reads
    - unique_files_read
  change:
    - files_added
    - files_modified
    - files_deleted
    - lines_added
    - lines_deleted
    - modules_touched
    - dependencies_added
    - dependencies_removed
  time:
    - agent_time
    - build_time
    - test_time
    - validation_time
    - total_time
  architecture_discovery_cost:
    - files_read_before_first_edit
    - unique_files_read_before_first_edit
    - searches_before_first_edit
    - tool_calls_before_first_edit
    - tokens_before_first_edit
    - seconds_before_first_edit
  stability_per_cell:
    - functional_success_rate
    - full_architecture_conformance_rate
    - dangerous_success_rate
    - acr_mean
    - acr_median
    - acr_sd
    - acr_iqr
    - acr_min
    - acr_max
    - dominant_strategy_share
    - module_jaccard_mean
    - module_jaccard_median
    - extension_point_usage_rate (task type C)
  cost:
    - goga_setup_initial_generation_time
    - goga_setup_manual_review_time
    - goga_setup_manual_correction_time
    - goga_setup_number_of_manual_corrections
    - goga_setup_artifact_size
    - goga_setup_maintenance_steps

primary_metric: dangerous_success_rate

failure_taxonomy:
  - wrong_layer
  - wrong_module
  - forbidden_dependency
  - duplicate_abstraction
  - bypassed_extension_point
  - public_api_leak
  - architecture_overengineering
  - unnecessary_cross_module_dependency
  - feature_incomplete
  - build_failure
  - test_failure
  - timeout
  # extend as new recurring patterns are observed; never retroactively changes primary architecture score

rules:
  no_manual_rescue: true
  clean_room_execution: true
  pilot_excluded_from_main_sample: true
  goga_architecture_freeze_before_randomization: true
  plan_frozen_after_phase_9: true
  invalid_runs_replaced_with_new_id_not_deleted: true

phases:
  - {id: 0, name: goga_research, status: complete}
  - {id: 1, name: environment, status: complete}
  - {id: 2, name: repository_selection, status: complete}
  - {id: 3, name: task_design, status: complete}
  - {id: 4, name: validators, status: complete}
  - {id: 5, name: controls, status: complete}
  - {id: 6, name: pilot, status: complete}
  - {id: 7, name: protocol_freeze, status: complete}
  - {id: 8, name: goga_architecture_preparation, status: complete}
  - {id: 9, name: randomization, status: not_started}
  - {id: 10, name: execution, status: not_started}
  - {id: 11, name: validation, status: not_started}
  - {id: 12, name: aggregation, status: not_started}
  - {id: 13, name: analysis, status: not_started}
  - {id: 14, name: report, status: not_started}
