task_id: R03-TA
repository: nestjs/nest
commit: f94e9eb15ba2a22f69aef234cb81333764d0b298
category: local_change

functional_requirements:
  - A new built-in HTTP exception class exists for status code 429 (Too Many Requests), usable
    directly from application code the same way sibling built-in exceptions are (e.g. importable
    from the framework's shared/common package's public entry point).
  - Instantiating it with no arguments produces a sensible default message ("Too Many Requests")
    and, when thrown uncaught from a route handler, the default response has statusCode 429.
  - Constructor supports overriding the message/response body via the first argument (object or
    string), matching the signature pattern of sibling exception classes (e.g. ConflictException,
    ForbiddenException).
  - Constructor supports the same second-argument pattern as siblings — either a short string
    description, or an options object carrying an underlying `cause`.
  - Unit test(s) exist for the new class, structured consistently with the existing per-exception
    spec files (packages/common/test/exceptions/*.spec.ts).

architectural_constraints:
  - New class must live under packages/common/exceptions/ (following the one-file-per-exception
    convention already used there, e.g. packages/common/exceptions/conflict.exception.ts,
    packages/common/exceptions/forbidden.exception.ts) and must extend the existing base
    HttpException class at packages/common/exceptions/http.exception.ts — not reimplement
    status/response handling from scratch.
  - Must be exported from the package's exceptions barrel (packages/common/exceptions/index.ts),
    following the existing alphabetical `export * from './x.exception.js'` convention, so it is
    reachable through the same public entry point as its siblings.
  - Must not add or modify any exception-filter logic in packages/core/exceptions/ (e.g.
    base-exception-filter.ts) — built-in HTTP exceptions are handled generically by the existing
    filter precisely because they carry their status code via HttpException; a correct solution
    needs zero changes outside packages/common.
  - Must not introduce a dependency from packages/common on packages/core or any packages/platform-*
    package.

required_existing_abstractions:
  - HttpException base class — packages/common/exceptions/http.exception.ts

allowed_dependencies:
  - packages/common (internal modules only, e.g. packages/common/enums/http-status.enum.ts)

forbidden_dependencies:
  - packages/core — a local exception-class addition has no legitimate reason to touch the
    exception-filter/response pipeline in core; touching it signals scope creep or a
    parallel/duplicated status-handling mechanism.
  - packages/platform-express, packages/platform-fastify, packages/platform-ws,
    packages/platform-socket.io, packages/microservices, packages/websockets — none of these are
    relevant to defining a new HTTP-status exception class.

expected_extension_points: []

public_api_constraints:
  - New class must carry a `@publicApi` TSDoc annotation consistent with sibling exception
    classes and be exported from the standard exceptions barrel.
  - Must not change the public constructor signature or behavior of HttpException or any existing
    sibling exception class.

functional_check_command: >
  Instantiate the new class directly (no HTTP server): `new TooManyRequestsException()` should
  have `.getStatus() === 429` and a response body with `statusCode: 429` and the default message;
  `new TooManyRequestsException('custom')` should override the message. Additionally, boot a
  minimal Nest HTTP app (e.g. with platform-express), add a route handler that throws the new
  exception, issue a request, and assert the HTTP response status is 429 with a JSON body
  containing `statusCode: 429`. Run via `npx vitest run packages/common/test/exceptions`.

architecture_check_command: >
  `git diff --name-only` against the pinned commit; grep changed files for
  `extends HttpException`; grep packages/core, packages/platform-*, packages/microservices,
  packages/websockets for the new class name to confirm no cross-package leakage.

architecture_checks:
  - id: AC1
    description: Change is scoped to packages/common/exceptions (+ its barrel + its tests), not spread into other packages.
    method: "`git diff --name-only <base>..<head>` and inspect the path prefixes of every changed/added file."
    expected_result_if_correct: >
      All added/modified files are rooted at packages/common/exceptions/,
      packages/common/exceptions/index.ts, and packages/common/test/exceptions/ (optionally
      packages/common/utils/http-error-by-code.util.ts if the solution also wires the new status
      into that lookup table, which is a reasonable but not required extra).
    expected_result_if_trap: >
      Files also touched under packages/core/exceptions/, packages/platform-express/,
      packages/platform-fastify/, or similar — indicating the new status code was hacked in via a
      new filter or platform-specific special-casing instead of a plain HttpException subclass.
  - id: AC2
    description: New class extends the existing HttpException base class rather than reimplementing exception behavior.
    method: "grep -n 'extends HttpException' on the new exception file."
    expected_result_if_correct: Present; class body is a thin constructor analogous to ConflictException/ForbiddenException.
    expected_result_if_trap: >
      Class extends `Error` directly, or reimplements `getStatus()`/`getResponse()` itself, or the
      429 status is special-cased inside packages/core/exceptions/base-exception-filter.ts instead
      of being carried by the exception object.
  - id: AC3
    description: No new cross-package dependency edge is created.
    method: >
      Diff packages/common/package.json (dependencies/peerDependencies) before vs. after; grep the
      new/changed files for `from '@nestjs/core'` or `from '@nestjs/platform-`.
    expected_result_if_correct: package.json unchanged; no such imports present.
    expected_result_if_trap: A new dependency entry appears, or the new file imports from @nestjs/core or a platform package.
  - id: AC4
    description: New class is actually exported through the standard public barrel, not dead code or an ad hoc export path.
    method: >
      grep the new exception's export line in packages/common/exceptions/index.ts; confirm
      packages/common's root index re-exports packages/common/exceptions/index.ts (already true
      pre-change — verify it wasn't bypassed).
    expected_result_if_correct: >
      `export * from './too-many-requests.exception.js';` (or equivalent filename) present in the
      barrel, in the existing alphabetized style.
    expected_result_if_trap: >
      Class defined but never exported from the barrel (unusable from `@nestjs/common`), or
      exported from a new, non-standard entry point that sibling exceptions don't use.

notes_for_positive_negative_control: >
  Positive control: a new packages/common/exceptions/too-many-requests.exception.ts file, a thin
  subclass of HttpException with HttpStatus.TOO_MANY_REQUESTS baked in, default message "Too Many
  Requests", exported from packages/common/exceptions/index.ts, with a spec file mirroring
  packages/common/test/exceptions/conflict.exception.spec.ts. Negative/trap control: the same
  observable behavior achieved by, e.g., adding a bespoke `RateLimitException` that extends `Error`
  and gets special-cased inside packages/core/exceptions/base-exception-filter.ts (or a new
  exception filter registered globally) to translate it into a 429 response — this can pass a
  request-level functional test yet clearly duplicates/bypasses the existing generic
  HttpException-handling path.
