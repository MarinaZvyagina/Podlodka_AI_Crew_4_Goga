task_id: R04-TA
repository: excalidraw/excalidraw
commit: e160ff7ba0641fba729c528482de5277ffb19c58
category: local_change

functional_requirements:
  - "Given a typed name containing any of the reserved filesystem characters
    ( / \\ : * ? \" < > | ) or ASCII control characters, the name that is actually
    used when saving/exporting to disk must not contain those characters."
  - "Given a name consisting only of whitespace, or an empty string, the persisted/used
    name must fall back to a non-empty, valid default rather than producing a blank or
    unusable file name."
  - "Given a name with trailing dot(s) or trailing whitespace, the persisted/used name
    must not end in a dot or whitespace (both are silently altered by Windows and can
    desync what the user sees from what was saved)."
  - "The name-entry field itself must remain freely editable while typing (sanitization
    must not fight every keystroke / must not relocate the caret unexpectedly) — sanitize
    at the point the name is committed/used, not necessarily on every keystroke."
  - "When the committed name differs from what the user typed (i.e. sanitization changed
    it), the user must receive some visible indication (e.g. the field reflects the
    adjusted value, or a toast/tooltip appears)."

architectural_constraints:
  - "The fix must live inside packages/excalidraw (the library). It must not require any
    change in excalidraw-app, since the same bug affects every host application that
    embeds the library, not just excalidraw.com."
  - "The change must not introduce a dependency from packages/excalidraw on
    packages/element or packages/math — this is a pure UI/text-input concern unrelated
    to element/geometry data, evidenced by ProjectName.tsx
    (packages/excalidraw/components/ProjectName.tsx) having zero imports from those
    packages today."
  - "Sanitization logic should be centralized (one function/module used from the
    the name-editing UI and/or the save path), not duplicated ad hoc in multiple
    call sites — evidenced by the fact that today there is exactly one input surface
    (packages/excalidraw/components/ProjectName.tsx, wired via
    packages/excalidraw/actions/actionExport.tsx's actionChangeProjectName) and one
    consumption point (packages/excalidraw/data/filesystem.ts fileSave, and
    packages/excalidraw/data/json.ts saveAsJSON) that turns the name into a real file
    name."
  - "Must not change the public ExcalidrawProps/AppState field types in a
    backwards-incompatible way (e.g. the `name` prop/state must remain an optional
    string), since @excalidraw/excalidraw is a published npm package
    (packages/excalidraw/package.json)."

required_existing_abstractions:
  - "packages/excalidraw/components/ProjectName.tsx (existing name-input component)"
  - "packages/excalidraw/actions/actionExport.tsx — actionChangeProjectName (existing
    action that commits appState.name)"

allowed_dependencies:
  - "packages/excalidraw internal modules only (components/, actions/, data/)"
  - "@excalidraw/common (already a dependency of packages/excalidraw) if a small helper
    belongs there"

forbidden_dependencies:
  - "No new third-party npm package for filename sanitization — the character set that
    needs stripping is small and fixed; adding an external dependency for this is
    disproportionate and inconsistent with how the rest of packages/excalidraw/data
    handles file names today (packages/excalidraw/data/filesystem.ts has no such
    dependency)."
  - "No new dependency edge from packages/element or packages/math into
    packages/excalidraw, or vice versa for this feature — the change is UI/data-layer
    only and must not reach into element/geometry packages."
  - "No new dependency edge from packages/excalidraw into excalidraw-app (wrong
    direction; the app consumes the library, never the reverse)."

expected_extension_points: []

public_api_constraints:
  - "AppState['name'] / ExcalidrawProps name-related fields must remain optional/string
    and backward compatible; no new required props on the <Excalidraw> component."

functional_check_command: >
  Add/extend a vitest test (consistent with existing tests under
  packages/excalidraw/components/*.test.tsx) that: (1) types
  'my/plan:v2*final?.txt.' into the ProjectName field (or calls the sanitizer function
  directly with that string plus a handful of other cases — empty string, '   ',
  'a<b>c', 'trailing.', 'trailing ') and asserts the value that would be handed to
  fileSave()/saveAsJSON() contains none of / \ : * ? " < > | and does not start/end with
  a dot or whitespace and is non-empty; run with `npx vitest run <test file>`.

architecture_check_command: >
  Manual review + grep: (1) `git diff --stat` shows changes confined to files under
  packages/excalidraw/ (no packages/element, packages/math, or excalidraw-app files
  touched); (2) grep the diff for a single sanitization function/module rather than the
  same character-stripping regex/logic repeated in more than one file; (3) confirm no
  new entries were added to packages/excalidraw/package.json "dependencies".

architecture_checks:
  - id: AC1
    description: "Change stays within the packages/excalidraw library boundary."
    method: "git diff --name-only against the pinned commit; check every changed
      production file path starts with packages/excalidraw/"
    expected_result_if_correct: "All changed files are under packages/excalidraw/
      (e.g. components/ProjectName.tsx, actions/actionExport.tsx, data/filesystem.ts,
      or a new small sanitization helper in one of these areas)."
    expected_result_if_trap: "N/A for this task category (no trap variant required),
      but a naive over-reach would touch excalidraw-app/ or packages/element/ — that
      would fail this check."
  - id: AC2
    description: "No duplicated sanitization logic across multiple call sites."
    method: "grep the diff for the character class pattern (e.g. a regex containing
      the reserved characters) and count distinct definitions."
    expected_result_if_correct: "Exactly one function/definition of the sanitization
      rule, imported/reused wherever the name is committed or used for saving."
    expected_result_if_trap: "The same character-stripping logic re-implemented
      independently in two or more files (e.g. once in ProjectName.tsx and again in
      filesystem.ts) — acceptable functionally but a maintainability/architecture
      smell worth flagging."
  - id: AC3
    description: "No new external dependency added for this bounded, single-component
      task."
    method: "diff packages/excalidraw/package.json before/after."
    expected_result_if_correct: "No new lines added under dependencies."
    expected_result_if_trap: "A new npm package (e.g. a slugify/sanitize-filename
      library) was added to package.json."
  - id: AC4
    description: "Public component API remains backward compatible."
    method: "diff packages/excalidraw/types.ts for the AppState/ExcalidrawProps
      name-related fields."
    expected_result_if_correct: "name-related fields remain optional and the same
      primitive type (string), no new required props."
    expected_result_if_trap: "A required prop was added, or the type of an existing
      public field was narrowed/changed in a breaking way."

notes_for_positive_negative_control: >
  Positive control: a small pure function (e.g. `sanitizeFileName(name: string): string`)
  added under packages/excalidraw/data/ or components/, called from
  actionChangeProjectName's perform (or from ProjectName's onChange/onBlur) and reused by
  fileSave/saveAsJSON so there is one source of truth. Negative control: functionally
  works (e.g. inlines a `.replace(/[\/\\:*?"<>|]/g, "")` directly and repeatedly at both
  the component and the fileSave call site, or pulls in a new left-pad-style npm
  dependency) — passes the functional vitest check but fails AC2/AC3 above.
