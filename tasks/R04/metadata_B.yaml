task_id: R04-TB
repository: excalidraw/excalidraw
commit: e160ff7ba0641fba729c528482de5277ffb19c58
category: cross_module_feature

functional_requirements:
  - "Selecting a single rectangle shows a live area readout equal to width * height,
    regardless of the rectangle's rotation angle (rotating must not change the reported
    area)."
  - "Selecting a single ellipse shows a live area readout equal to pi * (width/2) *
    (height/2), regardless of rotation."
  - "Selecting a single diamond shows a live area readout equal to (width * height) / 2,
    regardless of rotation."
  - "Selecting a closed/polygon-mode line, or a closed hand-drawn (freedraw) shape, shows
    a live area readout equal to the enclosed polygon area of its actual point path (not
    its bounding box width*height) — verified by a non-rectangular closed multi-point
    shape whose bounding-box area is measurably larger than its true enclosed area."
  - "Resizing or reshaping the selected shape updates the displayed area immediately
    (same recompute cadence as the existing width/height readouts)."
  - "Selecting an open line, an arrow, or a text element does not show a misleading area
    number (omitting the row entirely is acceptable)."

architectural_constraints:
  - "Geometry/area math must not be re-implemented ad hoc inside the UI component with
    per-type formulas hand-derived from element.width/element.height alone — closed
    polygon shapes (closed lines, closed freedraw) do not have a meaningful area from
    width*height and require actual point-based computation. This is evidenced by
    packages/math/src/polygon.ts already providing `polygonArea`/`polygonSignedArea`
    (shoelace formula) as the project's existing general-purpose polygon-area
    primitive, and packages/element/src/shape.ts's `getElementShape()` already
    building a per-element-type geometric shape (`GeometricShape`, defined in
    packages/utils/src/shape.ts) used elsewhere in the codebase (hit-testing/collision)
    for exactly this rectangle/diamond/ellipse/line/freedraw dispatch."
  - "The UI layer (packages/excalidraw/components/Stats/*) must only orchestrate:
    it should call into geometry/element-layer code to obtain the shape/area rather than
    duplicating the rectangle/diamond/ellipse-area formulas or the shoelace-formula loop
    inline in the component file. This mirrors the existing pattern in
    packages/excalidraw/components/Stats/index.tsx and Dimension.tsx, which already
    import computational helpers from @excalidraw/element and @excalidraw/math rather
    than reimplementing geometry."
  - "packages/math and packages/element must not gain a new dependency on
    packages/excalidraw (the dependency direction in this monorepo is strictly
    common -> math -> element -> excalidraw; verified via each package's
    package.json 'dependencies' block) — any new area-computation helper added to
    math/element must remain UI-agnostic (no React, no appState types)."
  - "Rotation must be handled correctly: because rectangle/diamond/ellipse area formulas
    are rotation-invariant, but polygon-based area for closed lines/freedraw is only
    correct if computed from the shape's own (rotated or local) point coordinates, not
    from an axis-aligned bounding box recomputed after rotation."

required_existing_abstractions:
  - "packages/math/src/polygon.ts — polygonArea / polygonSignedArea"
  - "packages/element/src/shape.ts — getElementShape() (per-element-type geometric
    shape dispatch: rectangle/diamond/frame/etc -> getPolygonShape, ellipse ->
    getEllipseShape, line/arrow/freedraw -> curve/closed-curve/freedraw shape)"
  - "packages/utils/src/shape.ts — GeometricShape / Ellipse / Polygon types produced by
    getElementShape()"
  - "packages/excalidraw/components/Stats/index.tsx and Dimension.tsx — existing live
    per-element stats panel that already re-renders on scene/selection change"

allowed_dependencies:
  - "packages/excalidraw -> @excalidraw/element (already a dependency)"
  - "packages/excalidraw -> @excalidraw/math (already a dependency)"
  - "packages/excalidraw -> @excalidraw/utils (already used elsewhere in the app layer;
    if importing GeometricShape types requires adding @excalidraw/utils as an explicit
    dependency of packages/excalidraw, that is allowed since it is an existing sibling
    package, not a new external one)"
  - "packages/element -> @excalidraw/math (already a dependency)"

forbidden_dependencies:
  - "packages/math -> packages/element or packages/excalidraw (would invert the
    established dependency direction; math is the lowest-level geometry package)."
  - "packages/element -> packages/excalidraw (would invert the established direction;
    excalidraw depends on element, never the reverse)."
  - "No new third-party geometry/math npm library (e.g. turf.js, geometric) — the
    shoelace-formula area function and per-shape dispatch already exist in-repo."

expected_extension_points: []

public_api_constraints:
  - "No changes required to the public <Excalidraw> component props; this is an
    internal panel enhancement."

functional_check_command: >
  Add/extend a vitest test file under packages/excalidraw/components/Stats/ (alongside
  the existing stats.test.tsx) that creates a rectangle, an ellipse, a diamond, and a
  closed polygon-mode line with known non-rectangular point coordinates, selects each in
  turn, and asserts the rendered area value matches the expected formula/shoelace result
  within a small rounding tolerance; also assert rotating the rectangle by 30 degrees
  does not change the displayed area. Run with `npx vitest run
  packages/excalidraw/components/Stats/stats.test.tsx` (or the new test file).

architecture_check_command: >
  Manual code review + grep: (1) grep the diff in packages/excalidraw/components/Stats/
  for inline reimplementations of shoelace/cross-product area math or hardcoded
  per-type area formulas (pi * a * b, w*h/2, w*h) living directly in the .tsx file
  rather than being imported from @excalidraw/math or @excalidraw/element; (2) confirm
  packages/math/package.json and packages/element/package.json gained no new
  dependency on @excalidraw/excalidraw or @excalidraw/utils; (3) confirm the same
  area-computation code is not duplicated for the single-selection and
  multi-selection code paths.

architecture_checks:
  - id: AC1
    description: "Area math for non-rectangular closed shapes (closed lines/freedraw)
      is computed from actual point data via polygon math, not approximated from the
      bounding box."
    method: "Run the functional test case with a non-rectangular closed multi-point
      shape and compare the displayed area against both (a) the true shoelace area and
      (b) width*height of its bounding box, which must differ for the chosen test
      shape; correct implementations match (a)."
    expected_result_if_correct: "Displayed area matches the shoelace-formula area of
      the actual points, not the bounding-box area."
    expected_result_if_trap: "Displayed area equals width*height of the bounding box
      for every shape type, including the non-rectangular closed shape (i.e. the
      per-type dispatch was skipped and a single width*height formula was applied
      everywhere)."
  - id: AC2
    description: "Geometry computation lives in / is reused from the element or math
      layer, not duplicated inline in the Stats UI component."
    method: "grep packages/excalidraw/components/Stats/*.tsx diff for a shoelace-style
      accumulation loop (e.g. `sum +=` over point pairs) or hardcoded `Math.PI *`
      ellipse-area formulas written directly in the component."
    expected_result_if_correct: "No such inline math in the .tsx diff; the component
      only calls an imported function/hook that returns an area number."
    expected_result_if_trap: "The shoelace loop or per-type area formulas are written
      directly inside the Stats component file."
  - id: AC3
    description: "Dependency direction is preserved: math/element packages do not
      import from excalidraw."
    method: "grep packages/math/src/**/*.ts and packages/element/src/**/*.ts diffs for
      any `from \"@excalidraw/excalidraw\"` or `from \"../../excalidraw\"`-style import;
      also check package.json dependency lists."
    expected_result_if_correct: "No such imports/dependency entries."
    expected_result_if_trap: "packages/math or packages/element imports a type or
      helper from packages/excalidraw (e.g. AppState) to compute area, inverting the
      dependency direction."
  - id: AC4
    description: "Rotation invariance for rectangle/diamond/ellipse."
    method: "Functional test: compute area before and after applying a rotation
      transform to the same element; compare."
    expected_result_if_correct: "Area unchanged after rotation."
    expected_result_if_trap: "Area computed from a post-rotation axis-aligned bounding
      box, changing (typically increasing) after rotation."

notes_for_positive_negative_control: >
  Positive control: Stats/Dimension.tsx (or a new sibling e.g. Area.tsx) calls
  getElementShape(element, elementsMap) from @excalidraw/element, then either reads
  width/height directly for rectangle/diamond/ellipse (rotation-invariant by
  construction) or calls polygonArea(shape.data) from @excalidraw/math for
  polygon-shaped results, formatted with the same `round()` helper already used for
  width/height. Negative control: a `getArea(element)` helper written inline in
  Stats/index.tsx or Dimension.tsx that always returns `element.width * element.height`
  (or applies a rotated-bounding-box recomputation) — passes for plain rectangles and
  even superficially "looks right" for ellipse/diamond if a naive constant multiplier is
  bolted on, but is measurably wrong for a non-rectangular closed line/freedraw shape and
  for rotated shapes if a bounding-box recompute is used, and duplicates geometry logic
  that already exists in @excalidraw/math and @excalidraw/element.
