task_id: R05-TC
repository: VictoriaMetrics/VictoriaMetrics
commit: f65ae841ace8f686ddc0dc17fe936d0bf38e568c
category: existing_extension_point

functional_requirements:
  - "Users can configure a new target source (e.g. scaleway_sd_configs) inside -promscrape.config scrape_configs, following the same YAML shape (list of SD-config objects per scrape_config) as the 22 other supported discovery mechanisms."
  - "Each discovered Scaleway instance produces one scrape target carrying metadata labels for at least: instance name, zone, tags, commercial/instance type, and public/private IP addresses, usable in relabel_configs."
  - "Targets refresh on a periodic interval without a full vmagent restart (configurable refresh interval, following the SDCheckInterval-style convention used by existing backends)."
  - "Authentication uses an API-token style config field plus the same optional HTTP-client/proxy configuration options (promauth.HTTPClientConfig, proxy.URL) other cloud backends already expose."
  - "Unit tests use fake/recorded HTTP responses, not the real Scaleway API."
  - "New config section documented alongside existing *_sd_configs documentation."

architectural_constraints:
  - "Implementation must be added as a new package under lib/promscrape/discovery/ (mirroring the 22 existing backends there: azure, consul, consulagent, digitalocean, dns, docker, dockerswarm, ec2, eureka, gce, hetzner, http, kubernetes, kuma, linode, marathon, nomad, openstack, ovhcloud, puppetdb, vultr, yandexcloud), exposing an SDConfig struct with a GetLabels(baseDir string) ([]*promutil.Labels, error) method - this is the unnamed interface (targetLabelsGetter, defined at lib/promscrape/config.go around line 851-853) that every existing backend already satisfies structurally (see e.g. lib/promscrape/discovery/digitalocean/digitalocean.go's GetLabels method)."
  - "New field must be added to the ScrapeConfig struct in lib/promscrape/config.go (e.g. ScaleWaySDConfigs []scaleway.SDConfig with yaml tag scaleway_sd_configs,omitempty), alongside the other *SDConfigs fields (around lines 320-343 at the pinned commit)."
  - "A new getScaleWaySDScrapeWork function must be added to lib/promscrape/config.go following the exact pattern of getDigitalOceanDScrapeWork/getAzureSDScrapeWork (build a visitConfigs closure over the new ScrapeConfig field, call cfg.getScrapeWorkGeneric(visitConfigs, scaleway_sd_config, prev))."
  - "The new backend must be registered in the discovery dispatch list in lib/promscrape/scraper.go via a scs.add(scaleway_sd_configs, *scaleway.SDCheckInterval, ...) call, next to the existing 22 scs.add(...) calls (around lines 129-152 at the pinned commit)."
  - "If the backend needs a persistent connection/background refresh loop (unlikely for a simple polling API like Scaleway's), it should follow the MustStart/MustStop convention used by kubernetes and http (not invent a separate lifecycle mechanism)."
  - "Must NOT be implemented as a variant of http_sd_configs (i.e. telling users to run a sidecar script that polls Scaleway and serves http_sd_configs-compatible JSON) - the ticket requires first-class discovery support, not a workaround."

required_existing_abstractions:
  - "targetLabelsGetter interface (unnamed in the ticket) - lib/promscrape/config.go, defined at approx line 851: an interface with method GetLabels(baseDir string) ([]*promutil.Labels, error)"
  - "SD backend package convention - lib/promscrape/discovery/<name>/ (digitalocean is the closest structural analogue: simple polling REST API, single api.go + <name>.go file pair)"
  - "cfg.getScrapeWorkGeneric shared assembly helper - lib/promscrape/config.go"
  - "scs.add(...) registration list - lib/promscrape/scraper.go (approx lines 129-152)"

allowed_dependencies:
  - "lib/promauth, lib/proxy, lib/logger, lib/promutil (already used by every existing discovery/<name> package)"
  - "lib/promscrape/discoveryutil (shared HTTP-fetch helper already used by e.g. digitalocean)"

forbidden_dependencies:
  - "No new dependency edge from lib/promscrape/discovery/scaleway back into app/vmagent or app/victoria-metrics (discovery backends must stay app-agnostic, callable from any binary that imports lib/promscrape)"
  - "Must not depend on lib/storage or any ingestion-path package - service discovery only produces target lists, it does not touch stored data"

expected_extension_points:
  - "targetLabelsGetter interface plus SDConfig.GetLabels(baseDir) method, lib/promscrape/config.go around line 851-853, structurally implemented by every package in lib/promscrape/discovery/"
  - "Registration list in lib/promscrape/scraper.go's runScraper() via scs.add(name, checkInterval, fn), approx lines 129-152"

public_api_constraints:
  - "New scrape_configs YAML field must be additive (scaleway_sd_configs, omitempty) - must not change parsing/behavior of any existing *_sd_configs field."

functional_check_command: "go test ./lib/promscrape/... ./lib/promscrape/discovery/... ; run promscrape.config.dryRun against a config containing a scaleway_sd_configs block and confirm it parses without error"
architecture_check_command: "test -d lib/promscrape/discovery/scaleway && grep -n 'GetLabels(baseDir string)' lib/promscrape/discovery/scaleway/*.go && grep -n 'ScaleWaySDConfigs|ScalewaySDConfigs' lib/promscrape/config.go && grep -n 'scaleway_sd_configs' lib/promscrape/scraper.go"

architecture_checks:
  - id: AC1
    description: "A new lib/promscrape/discovery/scaleway package exists with an SDConfig type implementing GetLabels(baseDir string) ([]*promutil.Labels, error)."
    method: "ls lib/promscrape/discovery/ | grep -i scaleway; grep -n 'func (sdc \\*SDConfig) GetLabels' lib/promscrape/discovery/scaleway/*.go"
    expected_result_if_correct: "New discovery/scaleway package present, SDConfig.GetLabels method with the exact signature used by every other backend."
    expected_result_if_trap: "No new discovery/ package; feature implemented as a differently-shaped mechanism (see AC2-AC4)."
  - id: AC2
    description: "ScrapeConfig struct in lib/promscrape/config.go gains a ScaleWaySDConfigs field alongside the other *SDConfigs fields, and a matching getScaleWaySDScrapeWork function uses cfg.getScrapeWorkGeneric."
    method: "grep -n 'SDConfigs ' lib/promscrape/config.go | grep -i scaleway; grep -n 'func (cfg \\*Config) getScaleWaySDScrapeWork' lib/promscrape/config.go"
    expected_result_if_correct: "New struct field plus get*SDScrapeWork function present, calling getScrapeWorkGeneric exactly like the 22 existing ones."
    expected_result_if_trap: "Targets injected via a different mechanism, e.g. reusing/abusing FileSDConfig, generating a synthetic http_sd_configs entry programmatically, or adding an entirely separate target-source concept parallel to ScrapeConfig."
  - id: AC3
    description: "New backend registered in the scs.add(...) dispatch list in lib/promscrape/scraper.go."
    method: "grep -n 'scs.add(\"scaleway_sd_configs\"' lib/promscrape/scraper.go"
    expected_result_if_correct: "One new scs.add(scaleway_sd_configs, *scaleway.SDCheckInterval, ...) line added next to the existing registrations."
    expected_result_if_trap: "No registration in scraper.go's scs.add list - instead targets are merged in some ad hoc way (e.g. appended directly to ScrapeConfigs after YAML parsing, or handled in a bespoke goroutine started from app/vmagent/main.go)."
  - id: AC4
    description: "No workaround/parallel-mechanism implementation (e.g. sidecar-script-plus-http_sd_configs docs, or a bespoke external target providers plugin system invented for this one feature)."
    method: "Manual review of the diff and any new documentation added; confirm scaleway_sd_configs is a first-class config key parsed directly by lib/promscrape, not a suggestion to run an external poller."
    expected_result_if_correct: "First-class scaleway_sd_configs YAML key, no new generic external-SD plugin abstraction invented."
    expected_result_if_trap: "Feature implemented by documenting/building an external poller that emits http_sd_configs-compatible JSON, or by inventing a brand-new generic plugin-loading mechanism (e.g. dynamically loaded .so files, or a new YAML block like external_sd_configs with a command field) instead of using the existing per-backend package convention."

notes_for_positive_negative_control: >
  Positive control: new lib/promscrape/discovery/scaleway/{scaleway.go,api.go} package with
  SDConfig.GetLabels implementing the Scaleway Instances API call, a ScaleWaySDConfigs field
  added to ScrapeConfig in config.go, a getScaleWaySDScrapeWork function using
  getScrapeWorkGeneric, and one scs.add("scaleway_sd_configs", ...) line in scraper.go - this
  mirrors digitalocean exactly. Negative control: implement Scaleway discovery as a standalone
  goroutine started from app/vmagent/main.go that polls the Scaleway API directly and pushes
  synthesized target lists into vmagent's static_configs / FileSDConfig machinery (e.g. by
  writing a temp file consumed via file_sd_configs, or by directly mutating a ScrapeConfig's
  StaticConfigs at runtime) - this can functionally discover and scrape Scaleway instances
  while completely bypassing the targetLabelsGetter/discovery-package convention, failing
  AC1-AC3.
