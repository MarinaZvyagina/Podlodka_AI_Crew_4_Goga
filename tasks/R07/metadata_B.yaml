task_id: R07-TB
repository: mihonapp/mihon
commit: ac249e3668a57f24782a49218834064459ba2d09
category: cross_module_feature

functional_requirements:
  - From the Updates screen (list of new chapters for library series) and/or from a series'
    details screen, the user can choose to snooze/hide that series from the updates feed until a
    specific point in time (e.g. tomorrow, next week, or a custom date).
  - While snoozed, new chapters for that series do not appear in the updates feed, but chapters
    still download and the series' read/unread state, library membership, etc. are unaffected.
  - Once the snooze time has passed, the series automatically reappears in the updates feed the
    next time it has unseen content — no manual un-snooze action is required (users can also
    manually clear the snooze early).
  - Snoozing one series must not affect the updates-feed visibility of any other series.
  - The existing updates-feed filters (unread/started/bookmarked/excluded scanlators/categories)
    continue to work unchanged and combine correctly with the new snooze filter.

architectural_constraints:
  - "The 'is this manga currently snoozed' condition must be evaluated as part of the same
    query/data path that already builds the updates feed —
    data/src/main/sqldelight/tachiyomi/view/updatesView.sq (view `updatesView` + queries
    `getRecentUpdates`, `getRecentUpdatesWithFilters`, `getUpdatesByReadStatus`) and
    domain/src/main/java/tachiyomi/domain/updates/repository/UpdatesRepository.kt /
    domain/src/main/java/tachiyomi/domain/updates/interactor/GetUpdates.kt — the same way
    existing filters like excluded scanlators and categories already do it (see the
    `excludedScanlator`/`mangas_categories` joins in getRecentUpdatesWithFilters), not as a
    client-side post-filter applied in the presentation layer after the list is fetched."
  - "Persisting the snooze state requires a schema change: a new column on the `mangas` table
    (data/src/main/sqldelight/tachiyomi/data/mangas.sq, next migration file
    data/src/main/sqldelight/tachiyomi/migrations/15.sqm — migrations are currently numbered 1
    through 14) — not a new standalone in-memory/preferences-only store, since the value must
    survive process death and be queryable by the updates SQL view."
  - "Reading/writing this new field from outside the data module must go through the existing
    partial-update pattern: domain/src/main/java/tachiyomi/domain/manga/model/Manga.kt (add the
    field), domain/src/main/java/tachiyomi/domain/manga/model/MangaUpdate.kt (add the nullable
    field, mirroring how `notes: String? = null` is already threaded through), and
    domain/src/main/java/tachiyomi/domain/manga/repository/MangaRepository.kt's existing
    `update(update: MangaUpdate): Boolean` — not a new bespoke repository method that duplicates
    MangaRepository's update mechanism."
  - "A new, small domain interactor (comparable to the existing single-purpose interactor pattern,
    e.g. domain/src/main/java/tachiyomi/domain/manga/interactor/UpdateMangaNotes.kt) should be the
    entry point presentation code calls to set/clear the snooze; presentation code must not
    construct a MangaUpdate or call MangaRepository directly."
  - "Presentation-layer changes (Updates screen action, series details screen action) must call
    into the domain interactor(s) above; they must not query tachiyomi.data.Database or the
    mangas SQLDelight tables directly."

required_existing_abstractions:
  - "tachiyomi.domain.updates.repository.UpdatesRepository / GetUpdates —
    domain/src/main/java/tachiyomi/domain/updates/repository/UpdatesRepository.kt,
    domain/src/main/java/tachiyomi/domain/updates/interactor/GetUpdates.kt: existing
    flow-through-parameters pattern (hideExcludedScanlators, includedCategories,
    excludedCategories) that a new snooze filter parameter should follow."
  - "tachiyomi.domain.manga.model.MangaUpdate —
    domain/src/main/java/tachiyomi/domain/manga/model/MangaUpdate.kt: existing partial-update DTO
    pattern (Manga -> MangaUpdate -> MangaRepository.update -> MangaRepositoryImpl, as already
    used for `notes` and `memo`) that a new snooze field should reuse."
  - "data/src/main/sqldelight/tachiyomi/view/updatesView.sq: existing SQL-level filter pattern
    (see how `excluded_scanlators` and `mangas_categories` are already joined/filtered in
    getRecentUpdatesWithFilters) that a new snooze condition should follow."

allowed_dependencies:
  - data module (already depends on domain; may add new SQLDelight schema/migration/query files)
  - domain module (already depends on source-api, core:common; no new dependency needed)
  - app module (presentation code + DI wiring; already depends on domain and data)

forbidden_dependencies:
  - "domain/build.gradle.kts must not gain a dependency on projects.data — domain must keep
    defining the snooze concept (model field, repository interface, interactor) without importing
    SQLDelight-generated classes."
  - "presentation-core/build.gradle.kts must not gain a dependency on projects.domain or
    projects.data — this task's UI lives in the app module's eu.kanade.presentation.* package,
    not in the presentation-core module."
  - "No new dependency from data/src/main/java/tachiyomi/data/updates or
    data/src/main/java/tachiyomi/data/manga onto app-module presentation classes."

expected_extension_points: []

public_api_constraints:
  - "UpdatesRepository's and GetUpdates's existing public methods (awaitWithRead, subscribeAll,
    subscribeWithRead) should gain the new filter as an additional parameter/overload rather than
    being replaced, since other existing call sites of these methods exist and must keep
    compiling."

functional_check_command: >
  No existing automated test covers the updates feed or manga repository (repo has only ~7 unit
  test files total). Given the thin test suite, the expected functional validator is: (a) a new
  domain- or data-layer test (e.g. against a fake UpdatesRepository/MangaRepository, or a
  SQLDelight in-memory driver if the project sets one up for data-layer tests) verifying that a
  manga with a future snoozed-until timestamp is excluded from GetUpdates results and one with a
  past timestamp is included; run via `./gradlew :domain:testDebugUnitTest` and/or
  `./gradlew :data:testDebugUnitTest`. (b) Manual verification procedure: snooze a library series
  that has unread new chapters until a near-future time, confirm it disappears from the Updates
  screen, then advance past that time (or directly manipulate the stored timestamp) and confirm
  it reappears without further user action.

architecture_check_command: >
  git diff --name-only <base>..<head> | sort ; expect files under at least
  data/src/main/sqldelight/tachiyomi/{data/mangas.sq,view/updatesView.sq,migrations/15.sqm},
  domain/src/main/java/tachiyomi/domain/{manga,updates}/**, and
  app/src/main/java/eu/kanade/{presentation,tachiyomi}/**/updates or manga screens ; grep -rn
  "tachiyomi.data.Database\|extension_storeQueries\|mangasQueries"
  app/src/main/java/eu/kanade/presentation/ (expect no new direct SQLDelight/Database usage
  introduced by this change in presentation code).

architecture_checks:
  - id: AC1
    description: Snooze state persisted via schema migration, not ad hoc local storage.
    method: "Check for a new file data/src/main/sqldelight/tachiyomi/migrations/15.sqm and a new
      column on the mangas table in data/src/main/sqldelight/tachiyomi/data/mangas.sq."
    expected_result_if_correct: "New column added to the `mangas` table with an accompanying
      numbered migration file; existing columns/rows unaffected."
    expected_result_if_trap: "Snooze state stored only in SharedPreferences/DataStore (via a
      preferences class) keyed by manga id, invisible to the SQL view that builds the updates
      feed, or stored in a new unrelated ad hoc table with no migration file."
  - id: AC2
    description: Updates-feed exclusion happens at the query layer, not as a presentation-side
      filter.
    method: "Diff data/src/main/sqldelight/tachiyomi/view/updatesView.sq and
      domain/src/main/java/tachiyomi/domain/updates/repository/UpdatesRepository.kt; separately
      grep the app module's updates UI/ViewModel code for new `.filter {`/`.filterNot {` logic
      operating on a snooze field."
    expected_result_if_correct: "WHERE-clause (or equivalent SQLDelight query) change in
      updatesView.sq / its queries; UpdatesRepository/GetUpdates gain the new parameter; the
      updates ViewModel passes it through unchanged."
    expected_result_if_trap: "updatesView.sq / UpdatesRepository unchanged; instead the Updates
      screen's ViewModel or Composable fetches the full list and applies
      `.filter { it.manga.snoozedUntil < now }` in Kotlin in the presentation layer."
  - id: AC3
    description: Snooze read/write goes through MangaRepository's existing update mechanism via
      a dedicated interactor, not a new parallel repository.
    method: "grep for any newly added repository interface under
      domain/src/main/java/tachiyomi/domain/manga/repository/; grep the diff for `MangaUpdate(`
      to confirm the new interactor builds a MangaUpdate and calls an existing
      MangaRepository.update(...)."
    expected_result_if_correct: "A single new small interactor (e.g. SetMangaSnoozedUntil) that
      builds tachiyomi.domain.manga.model.MangaUpdate(id = ..., ...) and calls the existing
      MangaRepository.update(); no new repository interface for this feature."
    expected_result_if_trap: "A brand-new, independent repository/DAO interface + implementation
      created specifically for snoozing, duplicating MangaRepository's update plumbing, or the
      snooze value written directly via a raw database query from inside a ViewModel."
  - id: AC4
    description: No new dependency edge from domain to data.
    method: "diff domain/build.gradle.kts against base commit; grep -rn 'import tachiyomi.data'
      domain/src/main/java/"
    expected_result_if_correct: "domain/build.gradle.kts dependency list unchanged (still only
      projects.sourceApi, projects.core.common); no imports of tachiyomi.data.* inside domain/."
    expected_result_if_trap: "domain module modified to import SQLDelight-generated
      Database/Queries classes directly, or domain/build.gradle.kts gains
      implementation(projects.data)."
  - id: AC5
    description: Presentation code reaches the feature only through domain interactors.
    method: "grep -rn 'tachiyomi.data.Database\\|mangasQueries\\|updatesViewQueries'
      app/src/main/java/eu/kanade/presentation/ app/src/main/java/eu/kanade/tachiyomi/ui/updates/"
    expected_result_if_correct: "No matches introduced by the diff — presentation/ViewModel code
      only calls the new domain interactor and reads updated GetUpdates/LibraryManga models."
    expected_result_if_trap: "New code in a ViewModel/Composable directly injects `Database` or
      calls generated SQLDelight query classes to read or write the snooze flag."

notes_for_positive_negative_control: >
  Positive control: new `mangas.snoozed_until` column + migration, updatesView.sq/queries gain a
  snooze condition (excluding rows where snoozed_until is set and in the future), the
  UpdatesRepository/GetUpdates chain passes the current time through, domain gains
  Manga.snoozedUntil + MangaUpdate.snoozedUntil + a SetMangaSnoozedUntil interactor calling
  MangaRepository.update, and the Updates/manga-details UI calls that interactor. Negative
  control (functionally passes, architecturally wrong): snooze timestamp stored in a
  DataStore/SharedPreferences map inside the app module, and the Updates ViewModel manually
  filters the already-fetched list by that map in Kotlin — the feed correctly hides/reveals
  entries on schedule (so functional checks pass), but the filtering logic lives outside the
  existing query/domain pipeline, duplicates the existing filter mechanism, and is invisible to
  `getRecentUpdatesWithFilters`/other consumers of UpdatesRepository.
