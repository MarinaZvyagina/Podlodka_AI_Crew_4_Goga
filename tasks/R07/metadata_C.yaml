task_id: R07-TC
repository: mihonapp/mihon
commit: ac249e3668a57f24782a49218834064459ba2d09
category: existing_extension_point

functional_requirements:
  - Users can log into a self-hosted server (credential mechanism, e.g. username/password or an
    API key, is an implementation decision) from within the app.
  - Once logged in, reading progress (last chapter read, completion status) for library entries
    the user reads is pushed to that server as they read.
  - Users can log out, which stops further syncing and clears stored credentials.
  - The new integration appears as a distinct option alongside the other reading-progress-sync
    integrations the app already offers, without disrupting any of the existing ones.
  - Logging into the new integration and reading a chapter for a linked series must not require
    code changes anywhere in the chapter-reading/reader flow beyond what's needed to notify the
    existing sync mechanism the app already uses for its other integrations.

architectural_constraints:
  - "The new integration must be implemented as a new class extending/implementing the same
    abstraction already used for every existing reading-progress-sync integration — interface
    eu.kanade.tachiyomi.data.track.Tracker
    (app/src/main/java/eu/kanade/tachiyomi/data/track/Tracker.kt) and its shared base class
    eu.kanade.tachiyomi.data.track.BaseTracker
    (app/src/main/java/eu/kanade/tachiyomi/data/track/BaseTracker.kt), following the pattern of
    the existing self-hosted-server integrations eu.kanade.tachiyomi.data.track.kavita.Kavita,
    .../komga/Komga, .../suwayomi/Suwayomi
    (app/src/main/java/eu/kanade/tachiyomi/data/track/{kavita,komga,suwayomi}/)."
  - "It must be registered by adding one instance to the existing hardcoded list in
    eu.kanade.tachiyomi.data.track.TrackerManager
    (app/src/main/java/eu/kanade/tachiyomi/data/track/TrackerManager.kt: `val trackers =
    listOf(...)`), with a new stable numeric id added to the companion object constants, not a new
    parallel registry or standalone manager class."
  - "Chapter-read events must flow through the existing generic tracking pipeline
    (BaseTracker.setRemoteLastChapterRead / update(), invoked by the app's existing
    chapter-progress-sync call sites that iterate over
    TrackerManager.loggedInTrackers()/trackers) — reader/chapter-list code must not gain a new,
    integration-specific network call bolted directly onto the chapter-read handler."
  - "Login/credential storage must reuse the existing per-tracker preference storage already used
    by every other tracker (trackPreferences.setCredentials / trackUsername / trackPassword,
    inherited via BaseTracker), not a new bespoke SharedPreferences/DataStore key scheme."

required_existing_abstractions:
  - "eu.kanade.tachiyomi.data.track.Tracker —
    app/src/main/java/eu/kanade/tachiyomi/data/track/Tracker.kt: the interface every sync
    integration (MyAnimeList, AniList, Kitsu, Shikimori, Bangumi, Komga, MangaUpdates, Kavita,
    Suwayomi, Hikka, MangaBaka) implements."
  - "eu.kanade.tachiyomi.data.track.BaseTracker —
    app/src/main/java/eu/kanade/tachiyomi/data/track/BaseTracker.kt: abstract base providing
    credential storage, login-state flow, and the generic
    setRemoteStatus/setRemoteLastChapterRead/setRemoteScore update plumbing that concrete
    trackers only need to supply update()/login()/search() for."
  - "eu.kanade.tachiyomi.data.track.TrackerManager —
    app/src/main/java/eu/kanade/tachiyomi/data/track/TrackerManager.kt: the registry (`val
    trackers = listOf(...)`, `fun get(id)`, `fun getAll(ids)`) that every consumer of trackers
    (UI screens, sync call sites) iterates over instead of referencing individual tracker classes
    by name."

allowed_dependencies:
  - app module only (all existing tracker implementations live under
    app/src/main/java/eu/kanade/tachiyomi/data/track/, which already depends on domain/data/source-api)

forbidden_dependencies:
  - "domain and data modules must not gain new dependencies or logic specific to this new
    integration — trackers are an app-module-only concept; domain's
    tachiyomi.domain.track.model.Track model must remain integration-agnostic."
  - "No new standalone class (e.g. a manually-invoked SyncService) that duplicates
    TrackerManager's registry role, or that reader/chapter code calls directly by name,
    bypassing TrackerManager.trackers/loggedInTrackers()."

expected_extension_points:
  - "eu.kanade.tachiyomi.data.track.Tracker interface + eu.kanade.tachiyomi.data.track.TrackerManager
    registry — app/src/main/java/eu/kanade/tachiyomi/data/track/{Tracker.kt,BaseTracker.kt,TrackerManager.kt}.
    Verified by reading TrackerManager.kt: it hardcodes one instance per tracker (myAnimeList,
    aniList, kitsu, shikimori, bangumi, komga, mangaUpdates, kavita, suwayomi, hikka, mangaBaka)
    into `val trackers = listOf(...)`, and every consumer (`get(id)`, `getAll(ids)`,
    `loggedInTrackers()`) operates over that list polymorphically via the Tracker interface — this
    is the confirmed, sole in-repo mechanism for adding a new reading-progress-sync integration.
    (Note: new manga/content sources themselves are NOT implemented in this repo — they ship as
    separate extension APKs consumed via eu.kanade.tachiyomi.source.Source/CatalogueSource +
    SourceManager (source-api module) and are auto-discovered from installed extensions at
    runtime (see app/src/main/java/eu/kanade/tachiyomi/source/AndroidSourceManager.kt), so 'add a
    new content source' is not achievable as a self-contained in-repo benchmark task. Tracker was
    chosen over Source/CatalogueSource/SourceFactory for this reason — see RECON_NOTES.md.)"

public_api_constraints:
  - "The Tracker interface (app/src/main/java/eu/kanade/tachiyomi/data/track/Tracker.kt) itself
    must not be changed to accommodate the new integration — all required hooks (login, update,
    search, status/score lists, etc.) already exist and are used unmodified by every current
    tracker implementation."

functional_check_command: >
  No existing test covers any tracker (repo has only ~7 unit test files total; there is a
  DummyTracker test double at app/src/main/java/eu/kanade/test/DummyTracker.kt but no tracker unit
  tests). The expected functional check is: (a) confirm the project compiles
  (`./gradlew :app:compileDebugKotlin`) with the new tracker class added to
  TrackerManager.trackers; (b) manual verification: log into the new integration from the tracker
  settings UI, mark a chapter as read on a linked series, and confirm a network call is made from
  the new tracker's update()/setRemoteLastChapterRead() path (e.g. via a request-capturing OkHttp
  interceptor or mock server, mirroring how KavitaInterceptor/KomgaApi etc. are structured) rather
  than from new code inside the reader activity.

architecture_check_command: >
  grep -n "val trackers = listOf" -A 15
  app/src/main/java/eu/kanade/tachiyomi/data/track/TrackerManager.kt (expect the new tracker
  instance added to this list) ; grep -rln ": Tracker\|: BaseTracker"
  app/src/main/java/eu/kanade/tachiyomi/data/track/ (expect exactly one new file
  implementing/extending Tracker/BaseTracker) ; grep -rn "<new-service-name>"
  app/src/main/java/eu/kanade/tachiyomi/ui/reader/ app/src/main/java/eu/kanade/tachiyomi/ui/manga/
  (expect no direct references outside the track package — reader/chapter code should be unaware
  of specific tracker names, same as it is today for Kavita/Komga/Suwayomi).

architecture_checks:
  - id: AC1
    description: New integration implemented as a Tracker, registered in TrackerManager.
    method: "grep for a new class in
      app/src/main/java/eu/kanade/tachiyomi/data/track/<newname>/ declaring `class X(id: Long) :
      BaseTracker(id, \"...\")`; grep TrackerManager.kt's `trackers` list for a new entry."
    expected_result_if_correct: "Exactly one new class extends BaseTracker (or directly
      implements Tracker) and is added as one new entry in TrackerManager.trackers with a new
      unique companion-object id constant."
    expected_result_if_trap: "No new class in the track package; instead reading-progress sync is
      implemented via a new standalone class (e.g. under
      app/src/main/java/eu/kanade/tachiyomi/data/sync/ or directly inside a ViewModel) with its
      own login/update methods, never touching Tracker/TrackerManager."
  - id: AC2
    description: Chapter-read notification reuses the generic tracker update pipeline, not a new
      call site in the reader.
    method: "git diff for reader-related files
      (app/src/main/java/eu/kanade/tachiyomi/ui/reader/**) — check whether any new
      tracker-specific network/API call was added there, versus the diff being confined to the
      new tracker package plus, at most, an entry added to an existing loop over
      TrackerManager.trackers/loggedInTrackers()."
    expected_result_if_correct: "No new integration-specific code in ui/reader/; the existing
      generic 'update all logged-in trackers on chapter read' call site (which already iterates
      trackers polymorphically) picks up the new tracker automatically because it's in
      TrackerManager.trackers."
    expected_result_if_trap: "New code added inside the reader activity/viewmodel that directly
      imports the new tracker class and calls a bespoke sync method on it, parallel to (not
      integrated with) the existing tracker update loop."
  - id: AC3
    description: Credential storage reuses BaseTracker's existing preference plumbing.
    method: "grep the new tracker class and any new preference-related files for new
      SharedPreferences/DataStore keys unrelated to
      trackPreferences.trackUsername/trackPassword."
    expected_result_if_correct: "New tracker relies on inherited
      getUsername()/getPassword()/saveCredentials() from BaseTracker (backed by TrackPreferences,
      domain/src/main/java/eu/kanade/domain/track/service/TrackPreferences.kt) — no new
      preference keys added specifically for this integration's login state."
    expected_result_if_trap: "A new, separate preferences class or DataStore introduced just to
      store the new integration's username/password/token, duplicating what BaseTracker already
      provides to every tracker."
  - id: AC4
    description: No new dependency edges from domain/data modules for this feature.
    method: "diff domain/build.gradle.kts and data/build.gradle.kts against base commit; grep for
      new files under domain/src/main/java/tachiyomi/domain/track/ or
      data/src/main/java/**/track/ referencing the new integration by name."
    expected_result_if_correct: "domain and data build files unchanged;
      tachiyomi.domain.track.model.Track (the generic domain track model) is unmodified or, if
      extended, extended in an integration-agnostic way, consistent with how it already supports
      11 different trackers without naming any of them."
    expected_result_if_trap: "New integration-specific classes/fields added inside domain or data
      modules, or a new module dependency added to reach the new integration's networking code
      from domain/data."

notes_for_positive_negative_control: >
  Positive control: a new class in app/src/main/java/eu/kanade/tachiyomi/data/track/<name>/
  extends BaseTracker, implements login/update/search/refresh consistent with the
  Kavita/Komga/Suwayomi precedent, and is added as one new entry (with a new unique id) to
  TrackerManager's `trackers` list; existing generic call sites that loop over
  TrackerManager.trackers/loggedInTrackers() pick it up automatically, so no reader/chapter-list
  code changes are needed. Negative control (functionally passes, architecturally wrong): a new
  standalone class (e.g. `SelfHostedSyncManager`) with its own login()/markChapterRead() methods
  is instantiated directly inside the reader's chapter-completion handler and/or a new settings
  screen calls it directly — reading progress genuinely reaches the self-hosted server
  (functional checks pass), but the app now has two parallel, structurally different mechanisms
  for "sync progress with an external service," and the new one is invisible to TrackerManager,
  the shared tracker-settings UI, and any future generic tracker-consuming code.
