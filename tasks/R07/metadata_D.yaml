category: architecture_trap

functional_requirements:
  - Searching a source for a given query + filter combination, then repeating the identical
    search shortly afterward (e.g. navigating back to browse and re-entering the same query),
    returns previously-fetched results without issuing a new network request.
  - Popular/latest listing pages (not just explicit text search) benefit from the same caching
    for repeat visits within the cache's validity window.
  - Cached results are not returned indefinitely — after a bounded time window, or when the user
    explicitly triggers a refresh/reload of search results, a fresh network fetch happens.
  - Caching must not break pagination — scrolling to page 2+ of a cached search must still work
    correctly (i.e., caching is per (source, query-or-listing, filters) at a minimum, not naively
    per-page in a way that corrupts paging state).
  - Behavior for sources/listings that were never previously searched is unaffected (always
    fetches on first request, same as today).

architectural_constraints:
  - "The cache must sit behind tachiyomi.domain.source.repository.SourceRepository
    (domain/src/main/java/tachiyomi/domain/source/repository/SourceRepository.kt) — i.e. inside
    its implementation tachiyomi.data.source.SourceRepositoryImpl
    (data/src/main/java/tachiyomi/data/source/SourceRepositoryImpl.kt) and/or the paging sources
    it constructs (data/src/main/java/tachiyomi/data/source/SourcePagingSource.kt:
    SourceSearchPagingSource / SourcePopularPagingSource / SourceLatestPagingSource) — not inside
    app/src/main/java/eu/kanade/tachiyomi/ui/browse/source/browse/BrowseSourceViewModel.kt or any
    Composable/Screen."
  - "The existing call chain presentation (BrowseSourceViewModel) -> domain interactor
    tachiyomi.domain.source.interactor.GetRemoteManga
    (domain/src/main/java/tachiyomi/domain/source/interactor/GetRemoteManga.kt) -> SourceRepository
    -> SourcePagingSource -> eu.kanade.tachiyomi.source.Source.getSearchManga()/getPopularManga()/
    getLatestUpdates() (source-api) must remain the only path; BrowseSourceViewModel's public
    shape (it calls `getRemoteManga(sourceId, listing.query ?: \"\", listing.filters)` inside a
    Pager block) should not need to change to add a cache field/map."
  - "Precedent for where caches belong in this codebase: eu.kanade.tachiyomi.data.cache.CoverCache
    (app/src/main/java/eu/kanade/tachiyomi/data/cache/CoverCache.kt) is a dedicated data-layer
    class injected into ViewModels/repositories (BrowseSourceViewModel already injects it as
    `coverCache`), not an inline field on a ViewModel — a new search-results cache should follow
    the same convention (a dedicated class, not a `mutableMapOf<...>()` field declared inside
    BrowseSourceViewModel)."
  - "mihon.feature.migration.list.search.SmartSourceSearchEngine
    (app/src/main/java/mihon/feature/migration/list/search/SmartSourceSearchEngine.kt) also calls
    source.getSearchManga(...) directly for migration search, independent of
    BrowseSourceViewModel — a cache implemented only inside BrowseSourceViewModel would not
    benefit this second real consumer, which is evidence the cache belongs below both of them (in
    the data layer), not inside one particular ViewModel."

required_existing_abstractions:
  - "tachiyomi.domain.source.interactor.GetRemoteManga —
    domain/src/main/java/tachiyomi/domain/source/interactor/GetRemoteManga.kt: existing single
    entry point from presentation into remote-manga fetching (popular/latest/search)."
  - "tachiyomi.domain.source.repository.SourceRepository /
    tachiyomi.data.source.SourceRepositoryImpl —
    domain/src/main/java/tachiyomi/domain/source/repository/SourceRepository.kt,
    data/src/main/java/tachiyomi/data/source/SourceRepositoryImpl.kt: the interface/impl boundary
    where a new cache-backed decision ('serve from cache vs. hit network') naturally belongs,
    mirroring how eu.kanade.tachiyomi.data.cache.CoverCache already caches another kind of
    network-derived data behind a dedicated class."

allowed_dependencies:
  - data module (new cache class alongside SourceRepositoryImpl, e.g. under
    tachiyomi.data.source or eu.kanade.tachiyomi.data.cache) may depend on domain (already does)
    and standard caching utilities already used elsewhere in the app

forbidden_dependencies:
  - "app/src/main/java/eu/kanade/tachiyomi/ui/browse/source/browse/BrowseSourceViewModel.kt must
    not gain a new cache/map field or new caching-specific dependency — caching is a data-layer
    concern."
  - "presentation-core module must not gain any dependency related to this feature (caching lives
    entirely in app + data)."
  - "domain/build.gradle.kts must not gain a new dependency on projects.data (the cache decision
    can be made inside SourceRepositoryImpl/data without domain needing to know caching exists,
    since domain already only depends on the abstract SourceRepository interface)."

expected_extension_points: []

public_api_constraints:
  - "SourceRepository interface's existing method signatures (search/getPopular/getLatest,
    returning SourcePagingSource) should not need new parameters just to add caching — callers
    (GetRemoteManga, BrowseSourceViewModel) should be able to remain unaware that caching exists."

functional_check_command: >
  No existing test covers source browsing/search (repo has only ~7 unit test files total, none
  under data/src/test at all currently). The expected functional check is: (a) a new
  unit/integration-style test in data/src/test/java/tachiyomi/data/source/ (a new test
  file/directory, since none currently exists there) using a fake/mock Source whose
  getSearchManga() increments a call counter, asserting that two SourceRepositoryImpl.search()
  calls with identical (sourceId, query, filters) shortly apart result in exactly one call to the
  underlying source, while a call after the cache's expiry window (or after an explicit
  invalidate/refresh) results in a second call. (b) Manual verification: use a debugger/log
  statement in a real or test source's getSearchManga to confirm it is not re-invoked on an
  immediate repeat search of the same query in the Browse screen.

architecture_check_command: >
  grep -n "mutableMapOf\|MutableMap\|LruCache\|HashMap"
  app/src/main/java/eu/kanade/tachiyomi/ui/browse/source/browse/BrowseSourceViewModel.kt (expect
  NO new cache-like field added here) ; grep -rln "cache" data/src/main/java/tachiyomi/data/source/
  (expect a new cache-related file/class here, or inside SourceRepositoryImpl.kt itself) ; git
  diff --stat <base>..<head> (expect changes concentrated in
  data/src/main/java/tachiyomi/data/source/**, with BrowseSourceViewModel.kt either absent from
  the diff or touched only for something unrelated like a manual refresh trigger).

architecture_checks:
  - id: AC1
    description: Cache storage lives in the data layer (SourceRepositoryImpl /
      SourcePagingSource / a dedicated cache class), not in the ViewModel.
    method: "grep BrowseSourceViewModel.kt for any new field of a Map/Cache type; grep
      data/src/main/java/tachiyomi/data/source/ for new cache-related code."
    expected_result_if_correct: "No new cache field in BrowseSourceViewModel.kt; a new
      cache-backing structure (map, LruCache, or a small dedicated class) appears under
      data/src/main/java/tachiyomi/data/source/ or is wired into SourceRepositoryImpl."
    expected_result_if_trap: "BrowseSourceViewModel.kt (or a Composable/Screen under
      eu/kanade/presentation/browse/) declares a `mutableMapOf<String, MangasPage>()`-style field
      or similar, and checks/populates it directly before calling getRemoteManga / building the
      Pager."
  - id: AC2
    description: GetRemoteManga / SourceRepository's public contract is unchanged; caching is
      transparent to callers.
    method: "diff domain/src/main/java/tachiyomi/domain/source/interactor/GetRemoteManga.kt and
      domain/src/main/java/tachiyomi/domain/source/repository/SourceRepository.kt against base
      commit."
    expected_result_if_correct: "No signature changes; GetRemoteManga still takes (sourceId,
      query, filterList) and returns SourcePagingSource exactly as before."
    expected_result_if_trap: "New cache-related parameters (e.g. `forceRefresh: Boolean`,
      `useCache: Boolean`) leak into GetRemoteManga/SourceRepository's public signatures and up
      into BrowseSourceViewModel's call site, exposing a data-layer implementation detail through
      the domain boundary."
  - id: AC3
    description: Cache is positioned to benefit more than one consumer of source search (not
      hardwired to one screen).
    method: "Check whether mihon.feature.migration.list.search.SmartSourceSearchEngine.kt
      (app/src/main/java/mihon/feature/migration/list/search/SmartSourceSearchEngine.kt), which
      also calls source.getSearchManga() directly, would transparently benefit from the new
      cache, versus the cache being reachable only through BrowseSourceViewModel's specific code
      path."
    expected_result_if_correct: "Because the cache sits at/below SourceRepositoryImpl (or is a
      shared class both paths could use), it is architecturally positioned to help any consumer
      of source search, even though this task only wires it into the Browse flow — the design
      does not structurally preclude reuse."
    expected_result_if_trap: "The cache is implemented as a private detail entangled with
      BrowseSourceViewModel's Pager/state machine (e.g. keyed by UI state class instances),
      making it unreachable/unreusable by any other call site by construction."
  - id: AC4
    description: No new dependency edge from domain to data, and no new dependency from
      presentation-core.
    method: "diff domain/build.gradle.kts and presentation-core/build.gradle.kts against base
      commit."
    expected_result_if_correct: "Both unchanged."
    expected_result_if_trap: "domain/build.gradle.kts or presentation-core/build.gradle.kts gains
      a new project dependency to support the caching implementation."
  - id: AC5
    description: Cache invalidation logic is not duplicated ad hoc in multiple UI entry points.
    method: "grep the diff for how many distinct places implement 'is this cache entry stale' /
      'clear the cache' logic."
    expected_result_if_correct: "Invalidation (time-based expiry and/or explicit refresh) is
      implemented once, in the data-layer cache class, and triggered via a single method/hook."
    expected_result_if_trap: "Each screen or ViewModel that wants fresh data implements its own ad
      hoc 'clear my local map' logic, with no single source of truth for what counts as stale."

notes_for_positive_negative_control: >
  Positive control: a new small cache class (or a cache field added directly to
  SourceRepositoryImpl) keyed by (sourceId, query-or-listing, filters, page), consulted inside
  SourceRepositoryImpl.search()/getPopular()/getLatest() or inside the SourcePagingSource
  subclasses before calling source.getSearchManga()/getPopularManga()/getLatestUpdates(); entries
  expire after a fixed TTL or are cleared on an explicit refresh signal passed down through the
  existing repository call. BrowseSourceViewModel.kt requires no changes (or only a trivial
  "refresh" call). Negative control (functionally passes, architecturally wrong):
  BrowseSourceViewModel gets a new `private val searchCache =
  mutableMapOf<String, Flow<PagingData<Manga>>>()` (or similar) field, and the Pager-building
  code checks/populates this map directly, keyed by a string built from the query and filters,
  before calling getRemoteManga — repeated searches from the Browse screen correctly avoid a
  second network call (functional checks pass), but the cache is invisible to
  SourceRepository/GetRemoteManga, cannot be reused by SmartSourceSearchEngine's migration
  search, and duplicates a concern (network-response caching) that the codebase already
  establishes belongs in a dedicated data-layer class (per the CoverCache precedent).
