task_id: R08-TA
repository: signalapp/Signal-Android
commit: 441ba42c3f3175476a1f54eba8e72d8d6d304db7
category: local_change

functional_requirements:
  - "Blocked contacts screen displays blocked recipients sorted alphabetically by display name, case-insensitive (verify against app/src/main/java/org/thoughtcrime/securesms/blocked/BlockedUsersFragment.java list rendering)."
  - "Blocking or unblocking a recipient while the screen is open causes the visible list to re-sort correctly, not just append/remove in place."
  - "No unrelated caller of the underlying data query (RecipientTable.getBlocked(), app/src/main/java/org/thoughtcrime/securesms/database/RecipientTable.kt:729) is broken or silently changed in behavior. At the pinned commit, BlockedUsersRepository.java is the only in-tree caller of getBlocked(); a correct agent should verify this itself (e.g. via search) rather than assume it."

architectural_constraints:
  - "Change is confined to the existing blocked-contacts vertical: app/src/main/java/org/thoughtcrime/securesms/blocked/{BlockedUsersRepository.java, BlockedUsersViewModel.java, BlockedUsersFragment.java, BlockedUsersAdapter.java} and/or the shared query in app/src/main/java/org/thoughtcrime/securesms/database/RecipientTable.kt (fun getBlocked(), lines 729-736 at pinned commit, currently has no ORDER BY clause — confirmed unsorted)."
  - "This is entirely inside the :app Gradle module; no new module dependency (feature/*, lib/*, core/*) is needed or justified for a sort-order change."
  - "Sort logic should exist in exactly one place (repository/data layer, e.g. inside BlockedUsersRepository.getBlocked() or the underlying RecipientTable query), not duplicated independently in the Adapter and the ViewModel."
  - "The UI layer (BlockedUsersFragment.java, BlockedUsersAdapter.java) must not gain direct database/cursor access as a side effect of this change; it currently has none and should keep going through BlockedUsersRepository."

required_existing_abstractions:
  - "BlockedUsersRepository (app/src/main/java/org/thoughtcrime/securesms/blocked/BlockedUsersRepository.java) — expected to remain the sole data-access point for this screen."

allowed_dependencies:
  - ":app internal packages only — org.thoughtcrime.securesms.blocked, org.thoughtcrime.securesms.database, org.thoughtcrime.securesms.recipients"

forbidden_dependencies:
  - "Any new dependency from :app's blocked/ package on a feature/* or lib/* Gradle module — none is needed for a sort-order change; introducing one indicates scope creep or a wrong-layer solution."

expected_extension_points: []

public_api_constraints: []

functional_check_command: "Unit test check (author under app/src/test/java/org/thoughtcrime/securesms/blocked/): insert blocked recipients with display names in non-alphabetical insertion order (e.g. 'Zoe', 'Amy', 'Mike') into a test double/fake of RecipientTable, invoke BlockedUsersRepository.getBlocked()/BlockedUsersViewModel loading path, and assert the emitted list order is Amy, Mike, Zoe (case-insensitive). Equivalent: ./gradlew :app:testDebugUnitTest --tests \"org.thoughtcrime.securesms.blocked.*\""

architecture_check_command: "grep -Rn 'SignalDatabase' app/src/main/java/org/thoughtcrime/securesms/blocked/BlockedUsersFragment.java app/src/main/java/org/thoughtcrime/securesms/blocked/BlockedUsersAdapter.java app/src/main/java/org/thoughtcrime/securesms/blocked/BlockedUsersViewModel.java  — combined with manual review per architecture_checks below."

architecture_checks:
  - id: AC1
    description: "No new Gradle module dependency was introduced for a change that should stay entirely inside :app."
    method: "git diff --name-only against pinned commit; grep for any modified build.gradle.kts / settings.gradle.kts files."
    expected_result_if_correct: "No build.gradle.kts or settings.gradle.kts files appear in the diff."
    expected_result_if_trap: "N/A for this task (local_change, not architecture_trap) — but if it occurred, a new project(...) dependency line touching blocked/ functionality would be the failure signature."
  - id: AC2
    description: "Sort logic exists in exactly one place, not duplicated across layers."
    method: "grep -n 'sortedBy\\|sortWith\\|Comparator\\|ORDER BY' app/src/main/java/org/thoughtcrime/securesms/blocked/*.java app/src/main/java/org/thoughtcrime/securesms/database/RecipientTable.kt on the diff; count distinct files containing new sorting logic."
    expected_result_if_correct: "Exactly one file (repository or RecipientTable query layer) contains the new sorting logic."
    expected_result_if_trap: "Sorting logic duplicated in two or more of: Adapter, ViewModel, Repository, or Fragment (e.g. re-sorting on every RecyclerView bind)."
  - id: AC3
    description: "UI layer (Fragment/Adapter) does not gain direct database access."
    method: "grep -n 'SignalDatabase\\|rawQuery\\|Cursor' app/src/main/java/org/thoughtcrime/securesms/blocked/BlockedUsersFragment.java app/src/main/java/org/thoughtcrime/securesms/blocked/BlockedUsersAdapter.java"
    expected_result_if_correct: "No matches — UI layer stays free of direct DB access, same as before the change."
    expected_result_if_trap: "Matches found — UI class directly queries the database, bypassing BlockedUsersRepository."
  - id: AC4
    description: "ViewModel continues to go through BlockedUsersRepository rather than reaching around it into the database directly."
    method: "grep -n 'SignalDatabase' app/src/main/java/org/thoughtcrime/securesms/blocked/BlockedUsersViewModel.java"
    expected_result_if_correct: "No matches."
    expected_result_if_trap: "Match found — ViewModel bypasses the existing Repository abstraction."

notes_for_positive_negative_control: >
  Positive control: sorting is added inside BlockedUsersRepository.getBlocked() (e.g. mapping+sorting the resolved Recipients by
  Recipient.getDisplayName()) or as an ORDER BY / Comparator applied once in RecipientTable.getBlocked(); UI classes are untouched
  except for no-op wiring. Negative control: functionally-identical sorting implemented inline inside
  BlockedUsersAdapter.submitList() or BlockedUsersFragment's subscribe callback (i.e., sorting a List<Recipient> in the UI layer
  right before rendering) — this passes any functional "is the visible list alphabetical" check but fails AC3/AC2 because the
  data layer remains unsorted (any other future caller of getBlocked() would still see unsorted data) and duplicates a concern
  that belongs in the repository/data layer.
