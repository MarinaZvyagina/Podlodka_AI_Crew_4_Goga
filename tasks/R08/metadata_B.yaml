task_id: R08-TB
repository: signalapp/Signal-Android
commit: 441ba42c3f3175476a1f54eba8e72d8d6d304db7
category: cross_module_feature

functional_requirements:
  - "In the multi-item media send review flow (feature/media-send Gradle module), the user can mark one attachment in a multi-item batch to be sent at full/original quality, overriding the batch default for that item only."
  - "The override takes effect even if that attachment's upload has already started in the background (pre-upload happens before the user finishes reviewing/confirming the whole batch — see feature/media-send/src/main/java/org/signal/mediasend/preupload/PreUploadRepository.kt)."
  - "The override survives the app process being killed and relaunched while the send is still in progress, i.e. it is persisted, not held only in transient UI/ViewModel state."
  - "Other attachments in the same batch are still compressed normally."

architectural_constraints:
  - "feature/media-send is a separate Gradle module. At the pinned commit it depends only on :core:ui, :core:util, :core:models, :lib:image-editor, :lib:glide, :lib:video, :feature:camera (see feature/media-send/build.gradle.kts). :app depends on feature:media-send, not the reverse (app/build.gradle.kts line ~816: implementation(project(\":feature:media-send\"))). A correct solution must not add a dependency from feature/media-send back onto :app (would be a circular Gradle dependency) or copy app-internal classes into the feature module."
  - "Any new capability the feature-module UI needs from app-level systems (persistence, job scheduling) must be exposed through the existing dependency-injection boundary: MediaSendDependencies.kt / MediaSendDependencies.Provider (feature/media-send/src/main/java/org/signal/mediasend/MediaSendDependencies.kt) and the PreUploadRepository / MediaSendRepository interfaces (feature/media-send/src/main/java/org/signal/mediasend/{preupload/PreUploadRepository.kt, MediaSendRepository.kt}), implemented app-side by MediaSendDependenciesProvider (app/src/main/java/org/thoughtcrime/securesms/dependencies/MediaSendDependenciesProvider.kt) and MediaSendV3PreUploadRepository (app/src/main/java/org/thoughtcrime/securesms/mediasend/v3/MediaSendV3PreUploadRepository.kt)."
  - "The attachment compression decision is already made by an existing background job, app/src/main/java/org/thoughtcrime/securesms/jobs/AttachmentCompressionJob.java, which already reads a persisted per-attachment flag — org.signal.core.models.media.TransformProperties.skipTransform (core/models/src/main/java/org/signal/core/models/media/TransformProperties.kt) — off the attachment's transformProperties and skips compression when set (AttachmentCompressionJob.java ~line 156-164: 'Skipping at the direction of the TransformProperties.'). A correct solution sets this existing flag on the specific attachment via the existing attachment-creation/pre-upload path rather than inventing new compression-skipping logic or a new job."
  - "Persistence of the per-attachment choice must go through the existing attachment data layer (SignalDatabase / AttachmentTable), reached via the app-side PreUploadRepository implementation, not via new ad hoc file-based state or SharedPreferences invented to survive process death."

required_existing_abstractions:
  - "MediaSendDependencies.Provider / PreUploadRepository interface — feature/media-send/src/main/java/org/signal/mediasend/{MediaSendDependencies.kt, preupload/PreUploadRepository.kt}"
  - "MediaSendDependenciesProvider / MediaSendV3PreUploadRepository (app-side implementation) — app/src/main/java/org/thoughtcrime/securesms/{dependencies/MediaSendDependenciesProvider.kt, mediasend/v3/MediaSendV3PreUploadRepository.kt}"
  - "TransformProperties.skipTransform / withSkipTransform() / forSkipTransform() — core/models/src/main/java/org/signal/core/models/media/TransformProperties.kt"

allowed_dependencies:
  - "feature:media-send -> core:util, core:models, core:ui, lib:image-editor, lib:glide, lib:video, feature:camera (all pre-existing)"
  - "app -> feature:media-send (pre-existing, one direction only)"

forbidden_dependencies:
  - "feature:media-send -> app, in any form (new project(\":app\") reference, or copy-pasted app-internal types) — this direction is architecturally forbidden because :app already depends on feature:media-send; reversing it creates a circular module graph and breaks the module's stated purpose of being free of app-specific systems (see PreUploadRepository.kt doc comment: 'This keeps feature/media-send free of direct dependencies on app-specific systems.')."

expected_extension_points: []

public_api_constraints:
  - "Any new method added to PreUploadRepository / MediaSendRepository / MediaSendDependencies.Provider is an interface change that both the feature-module callers and the app-side implementation (MediaSendDependenciesProvider) must be updated together — do not leave the interface and its implementation out of sync."

functional_check_command: "Integration-style check (author under app/src/test/java/org/thoughtcrime/securesms/mediasend/v3/ or as an androidTest given process-death survival is being tested): drive the multi-select send flow with >=3 media items, mark one item as full quality, confirm send; assert the persisted Attachment record for that item has transformProperties.skipTransform == true while the other items remain false, and that re-reading the attachment from SignalDatabase after simulating app process recreation (new AppDependencies/ViewModel instances re-reading from the same DB) still shows skipTransform == true before upload completes. Equivalent: ./gradlew :app:testDebugUnitTest --tests \"org.thoughtcrime.securesms.mediasend.v3.*\""

architecture_check_command: "grep -Rn 'project(\":app' feature/media-send/build.gradle.kts ; grep -Rn 'skipTransform\\|TransformProperties' <diff files> ; manual review per architecture_checks below."

architecture_checks:
  - id: AC1
    description: "feature/media-send's build file gains no dependency on :app (or any reversal of the existing one-directional edge)."
    method: "Diff feature/media-send/build.gradle.kts against the pinned commit; grep for 'project(\":app'."
    expected_result_if_correct: "No such line ever added; the module dependency list is unchanged or only gains core:*/lib:* entries."
    expected_result_if_trap: "A dependency on :app (or on an app-only package copied into the feature module) is added, which would also fail to build due to the circular module graph."
  - id: AC2
    description: "The new capability is exposed through the existing Provider/Repository interface pattern, not a new bespoke singleton inside the feature module."
    method: "Manual review of the diff in feature/media-send/src/main/java/org/signal/mediasend/{MediaSendDependencies.kt, preupload/PreUploadRepository.kt, MediaSendRepository.kt} versus any new standalone static holder class introduced elsewhere in the feature module."
    expected_result_if_correct: "A new method is added to PreUploadRepository (or MediaSendRepository) and implemented in MediaSendDependenciesProvider / MediaSendV3PreUploadRepository."
    expected_result_if_trap: "The feature module gains its own ad hoc mechanism (e.g. a new object/singleton reaching for Android job-scheduling or file-system APIs directly) instead of routing through the Provider interface."
  - id: AC3
    description: "Per-attachment quality choice reuses the existing TransformProperties.skipTransform field rather than new bespoke persistence."
    method: "grep -n 'skipTransform\\|TransformProperties' across the diff; separately check for any new file under app/src/main/java/org/thoughtcrime/securesms/database/helpers/migration/ (a new DB migration would indicate a new column was added instead of reusing the existing field)."
    expected_result_if_correct: "Diff sets transformProperties.skipTransform (e.g. via .withSkipTransform()/.forSkipTransform()) on the specific attachment; no new DB migration is introduced for this purpose."
    expected_result_if_trap: "A new DB column/migration duplicates what skipTransform already provides, or the choice is kept only in in-memory UI state (which would fail the process-death functional requirement), or stored in SharedPreferences keyed by attachment id."
  - id: AC4
    description: "AttachmentCompressionJob remains the single place that decides whether to compress; no duplicate compression-decision logic is added elsewhere."
    method: "grep -n 'compress\\|Transcod\\|skipTransform' across new/changed files outside app/src/main/java/org/thoughtcrime/securesms/jobs/AttachmentCompressionJob.java."
    expected_result_if_correct: "No new parallel compression-decision logic; AttachmentCompressionJob's existing check (line ~156-164) now behaves correctly simply because the flag is set correctly upstream."
    expected_result_if_trap: "A new job, or inline code elsewhere, re-implements 'skip compression if flagged,' duplicating AttachmentCompressionJob's existing responsibility."

notes_for_positive_negative_control: >
  Positive control: feature/media-send UI adds a per-thumbnail "full quality" toggle that updates local edit state, and on confirm/pre-upload
  threads that choice through a new PreUploadRepository method (or an added parameter on the existing preUpload() call) into
  MediaSendV3PreUploadRepository, which sets TransformProperties.forSkipTransform() on the specific Attachment before it's persisted via
  SignalDatabase.attachments / MediaUploadRepository.asAttachment — AttachmentCompressionJob then naturally skips it. Negative control:
  the toggle is implemented entirely within feature/media-send using only in-memory state passed as a function parameter down the Compose
  tree, with the actual "skip compression" decision reimplemented by having the feature module post-process the file directly (e.g. copying
  the original bytes over the compressed output) or by adding ad hoc SharedPreferences-based state — this can pass a simple "send one item at
  full quality" manual test but fails to survive process death and duplicates/bypasses the existing TransformProperties/job mechanism.
