task_id: R09-TA
repository: mozilla-mobile/firefox-ios
commit: de940072da700c2af7d74348b5775674d106d503
category: local_change

functional_requirements:
  - "Calling removeWindowData(forUUIDs:) (DefaultTabDataStore, BrowserKit/Sources/TabDataStore/TabDataStore.swift) removes both the primary window-data file AND the corresponding backup window-data file for each UUID in the list."
  - "Windows whose UUID is not in the forUUIDs list are left untouched, including their backup files."
  - "If a window has no backup file on disk (isBackup: true directory has no matching file), removal completes without throwing/crashing."
  - "clearAllWindowsData() behaviour (which already clears both primary and backup directories wholesale) is unaffected."
  - "fetchWindowData / saveWindowData behaviour is unaffected."

architectural_constraints:
  - "Change stays entirely inside the TabDataStore BrowserKit library target (BrowserKit/Sources/TabDataStore/). No new dependency from TabDataStore to any other BrowserKit target or to the Client app should be introduced."
  - "Use the existing TabFileManager abstraction (BrowserKit/Sources/TabDataStore/TabFileManager.swift: windowDataDirectory(isBackup:), contentsOfDirectory(at:), removeFileAt(path:)) to locate and delete the backup file — do not add direct FileManager/Foundation file-system calls inside DefaultTabDataStore, and do not reimplement path construction that already exists via windowURLPath(for:isBackup:)."
  - "Do not change the public TabDataStore protocol's method signatures (fetchWindowData, saveWindowData, clearAllWindowsData, fetchWindowDataUUIDs, removeWindowData) — this is a bug fix to existing behavior, not an API change."

required_existing_abstractions:
  - "TabFileManager protocol and DefaultTabFileManager, BrowserKit/Sources/TabDataStore/TabFileManager.swift (windowDataDirectory(isBackup: Bool), removeFileAt(path:))"
  - "DefaultTabDataStore.windowURLPath(for:isBackup:) private helper, BrowserKit/Sources/TabDataStore/TabDataStore.swift (already used for building both primary and backup file paths elsewhere in the same class)"

allowed_dependencies:
  - "TabDataStore -> Common (already an existing dependency per BrowserKit/Package.swift)"

forbidden_dependencies:
  - "TabDataStore -> any other BrowserKit target (Redux, ToolbarKit, Shared, etc.) — this is a leaf, single-purpose persistence target and a correct fix requires no new capability from elsewhere."
  - "TabDataStore -> firefox-ios/Client (main app) — BrowserKit targets must not depend on the Client app; TabDataStore is consumed BY Client, never the reverse."

expected_extension_points: []

public_api_constraints:
  - "No new public methods should be required on the TabDataStore protocol; the fix belongs inside removeWindowData(forUUIDs:) and/or private helpers of DefaultTabDataStore."

functional_check_command: "cd BrowserKit && swift test --filter TabDataStoreTests (BrowserKit is independently buildable/testable via plain `swift test`; this does not require the private Bitrise CI used for the full Client app)."
architecture_check_command: "Manual diff review scoped to BrowserKit/Sources/TabDataStore/*.swift: (1) confirm no files outside BrowserKit/Sources/TabDataStore/ (and its Tests) were modified; (2) `grep -n 'import' BrowserKit/Sources/TabDataStore/*.swift` to confirm only `Foundation` and `Common` are imported (no new imports); (3) grep for direct `FileManager.default` / `FileManager()` usage inside TabDataStore.swift outside of TabFileManager.swift."

architecture_checks:
  - id: AC1
    description: "Fix is scoped to the TabDataStore target only (single-component, no cross-module edits)."
    method: "git diff --stat against the pinned commit; assert every changed path starts with BrowserKit/Sources/TabDataStore/ or BrowserKit/Tests/TabDataStoreTests/."
    expected_result_if_correct: "Only TabDataStore.swift (and optionally TabFileManager.swift / its tests) are touched."
    expected_result_if_trap: "n/a for this task type — flag as a scope violation if Client app files or other BrowserKit targets are touched."
  - id: AC2
    description: "Backup removal is implemented via the existing TabFileManager abstraction, not ad-hoc file I/O."
    method: "grep -n 'FileManager' BrowserKit/Sources/TabDataStore/TabDataStore.swift — any match must be pre-existing, not newly introduced inside removeWindowData."
    expected_result_if_correct: "removeWindowData(forUUIDs:) calls fileManager.windowDataDirectory(isBackup: true), fileManager.contentsOfDirectory(at:), and fileManager.removeFileAt(path:) — mirroring the pattern already used for the primary directory in the same method."
    expected_result_if_trap: "New direct FileManager.default.removeItem(...) calls added inside TabDataStore.swift, duplicating logic that already exists in DefaultTabFileManager."
  - id: AC3
    description: "No new dependency edges added to the TabDataStore target's Package.swift manifest."
    method: "diff BrowserKit/Package.swift against the pinned-commit version; the TabDataStore target's `dependencies: [\"Common\"]` entry must be unchanged."
    expected_result_if_correct: "Package.swift unchanged."
    expected_result_if_trap: "n/a"
  - id: AC4
    description: "Positive/negative control differentiate on functional test outcome for the backup-cleanup requirement specifically."
    method: "Run a test that seeds mockFileManager.pathContents with a window UUID for both the primary and backup directory returns of contentsOfDirectory(at:), calls removeWindowData(forUUIDs:), and asserts fileManager.removeFileAtPathCalledCount reflects deletion in both directories (or equivalent tracked count)."
    expected_result_if_correct: "Backup file removal is exercised and asserted; test passes."
    expected_result_if_trap: "n/a — this is not an architecture-trap task; this check is a functional regression guard."

notes_for_positive_negative_control: >
  Positive control: removeWindowData(forUUIDs:) is extended to also fetch the backup directory's
  contents via fileManager.windowDataDirectory(isBackup: true) and delete matching backup files via
  fileManager.removeFileAt(path:), reusing the same UUID-matching helper already used for the primary
  directory. Negative control (functionally passes some naive "it deletes something" check but is
  architecturally sloppy): a fix that reaches around TabFileManager and calls
  FileManager.default.removeItem(at:) directly with a hand-built path string inside DefaultTabDataStore,
  or that only fixes clearAllWindowsData-adjacent code paths without touching removeWindowData at all
  (feature incomplete) — both should fail AC2/AC4 respectively even if a shallow manual test looks okay.
